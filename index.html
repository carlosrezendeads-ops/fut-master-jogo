    case "dispensar":{const p=G.players[+v];modal(`<h3>Dispensar ${esc(p.n)}?</h3><p>O clube paga 3 meses de salário de rescisão: ${dinheiro(p.sal*3)}.</p><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn perigo" data-a="dispconf" data-v="${p.id}">Dispensar</button></div>`);return;}
    case "dispconf":{fecharModal();const er=dispensar(+v);if(er)toastErro(er);expandido=null;salvar();break;}
    case "comprar":{const p=G.players[+v],pr=precoPedido(p);modal(`<h3>Contratar ${esc(p.n)}?</h3><p>${p.pos}, ${p.age} anos, força ${p.ov}.</p><div class="extrato num"><div><span>Pagamento ao clube</span><span>${pr?dinheiro(pr):"sem custo"}</span></div><div><span>Salário</span><span>${dinheiro(salarioPedido(p))}/mês</span></div><div><span>Caixa depois</span><span>${dinheiro(G.cash-pr)}</span></div>${fonteCompra(p.id)==="j"?`<div><span>Contratações nesta janela</span><span>${G.janela.compras+1} de ${MAX_COMPRAS}</span></div>`:""}</div><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn prim" data-a="compconf" data-v="${p.id}">Contratar</button></div>`);return;}
    case "compconf":{fecharModal();const er=contratar(+v);if(er){if(er!==RECUSA)toastErro(er)}else{toast("Contratado! Já está no elenco.");expandido=null}salvar();break;}
    case "div":divTab=+v;if(tabModo==="copa"||tabModo==="copan")tabModo="tab";break;
    case "tabmodo":tabModo=v;break;
    case "morig":merc.orig=v;break;
    case "reforma":{const er=fazerReforma(+v);if(er){toastErro(er);return}salvar();render();const c=G.clubs[G.user.club];
      modal(`<h3>Obra concluída!</h3>${fotoEstadio(G.reformas,estadioDe(c),c.cap)}<p style="margin-top:10px"><b>${esc(REFORMAS[+v].n)}</b>: +${REFORMAS[+v].cap.toLocaleString("pt-BR")} lugares.</p><div class="botoes"><button class="btn prim" data-a="fechar">Show!</button></div>`);confete();return;}
    case "ampliar":{const er=ampliar();if(er)toastErro(er);else toast("Obra concluída: +2.000 lugares.");salvar();break;}
    case "exportar":{const s=JSON.stringify(G);modal(`<h3>Código do jogo</h3><p class="muted peq">Copie todo o texto e guarde. Para carregar, use "Carregar código" em qualquer aparelho.</p><textarea id="exp-t" readonly>${esc(s)}</textarea><div class="botoes"><button class="btn" data-a="fechar">Fechar</button><button class="btn prim" data-a="copiar">Copiar</button></div>`);return;}
    case "copiar":{const t=$("#exp-t");const sel=()=>{t.focus();t.select();toast("Texto selecionado. Copie pelo menu do aparelho.")};try{navigator.clipboard.writeText(t.value).then(()=>toast("Código copiado."),sel)}catch(e){sel()}return;}
    case "importar":modal(`<h3>Carregar código</h3><p class="muted peq">Cole o código copiado de outro aparelho. O jogo atual será substituído.</p><textarea id="imp-t"></textarea><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn prim" data-a="impconf">Carregar</button></div>`);return;
    case "impconf":{try{const n=JSON.parse($("#imp-t").value);if(!n.clubs||!n.user||n.v!==2)throw 0;G=migrar(n);fecharModal();salvar();toast("Jogo carregado.");aba="inicio"}catch(e){toastErro("Código inválido. Confira se copiou o texto inteiro.");return}break;}
    case "novo":modal(`<h3>Começar novo jogo?</h3><p>O jogo atual será apagado deste navegador. Se quiser guardar, copie o código antes.</p><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn perigo" data-a="novoconf">Apagar e recomeçar</button></div>`);return;
    case "novoconf":fecharModal();pararTimer();G=null;W=novoW();try{localStorage.removeItem(CHAVE);localStorage.removeItem(CHAVE_BKP)}catch(e){}aba="inicio";abertura=false;break;
    case "fechar":fecharModal();return;
    case "perfil":perfilJogador(+v);return;
    case "vertime":modalTime(v);return;
    case "edlogin":modal(`<h3>Login do editor</h3><label class="campo"><span>Senha</span><input id="ed-senha" type="password" inputmode="numeric" maxlength="10" autocomplete="off"></label><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn prim" data-a="edentrar">Entrar</button></div>`);setTimeout(()=>{const i=document.getElementById("ed-senha");if(i)i.focus()},50);return;
    case "edentrar":{const s=(document.getElementById("ed-senha")||{}).value;if(s===SENHA_EDITOR){editorOn=true;try{sessionStorage.setItem("fut-editor","1")}catch(e){}fecharModal();toast("Modo editor ativado.");break}toastErro("Senha incorreta.");return;}
    case "edsair":editorOn=false;try{sessionStorage.removeItem("fut-editor")}catch(e){}toast("Você saiu do modo editor.");break;
    case "edgrupo":edSel.grupo=v;edSel.clube=null;edSel.busca="";break;
    case "edclube":edSel.clube=v===""?null:v;window.scrollTo(0,0);break;
    case "edbusca":edSel.busca=(document.getElementById("ed-busca")||{}).value||"";break;
    case "edjog":modalEditorJog(+v);return;
    case "edremfoto":if(G.rostosUp)delete G.rostosUp[+v];salvar();render();modalEditorJog(+v);return;
    case "edjogsalvar":salvarEditorJog(+v);fecharModal();salvar();toast("Jogador atualizado.");break;
    case "edtec":modalEditorTec(el.dataset.n);return;
    case "edtecsalvar":salvarEditorTec(el.dataset.n);fecharModal();salvar();toast("Técnico atualizado.");break;
    case "podiook":fecharModal();modalTemporada();return;
    case "teclenda":{const er=contratarTecLenda(+v,el.dataset.i);if(er){toastErro(er);return}salvar();confete();toast(`${TEC_LENDAS[+v][0]} contratado!`);break;}
    case "lenda":{const er=comprarLenda(+v,el.dataset.i);if(er){if(er!==RECUSA)toastErro(er);return}salvar();confete();toast(`${LENDAS[+v][0]} contratado!`);break;}
    case "tecrosto":if(!editorOn)return;modalRostoTec(el.dataset.n);return;
    case "tecescolhe":{G.tecFotos=G.tecFotos||{};G.tecFotos[el.dataset.n]={rf:+v};salvar();const sy=scrollY;render();scrollTo(0,sy);modalRostoTec(el.dataset.n);return;}
    case "tecremupl":{if(G.tecFotos)delete G.tecFotos[el.dataset.n];salvar();const sy=scrollY;render();scrollTo(0,sy);modalRostoTec(el.dataset.n);return;}
    case "rremupl":if(G.rostosUp)delete G.rostosUp[+v];salvar();modalTrocarRosto(+v);return;
    case "trocarosto":if(!editorOn){toast("A edição de fotos fica em Ajustes, no modo editor.");return}rostoFiltro="todos";rostoPag=0;modalTrocarRosto(+v);return;
    case "rpula":{const s=document.getElementById("rs-"+v),l=document.getElementById("rosto-lista");{const l=document.getElementById("rosto-lista");if(s&&l)l.scrollTo({top:l.scrollTop+s.getBoundingClientRect().top-l.getBoundingClientRect().top,behavior:"smooth"})}return;}
    case "rescolhe":{const p=G.players[+el.dataset.i];if(!p)return;if(G.rostosUp)delete G.rostosUp[p.id];if(+v<0)delete p.rf;else p.rf=+v;for(const k in RCACHE)if(k.startsWith(p.id+"|"))delete RCACHE[k];salvar();perfilJogador(p.id);const tela=document.querySelector("#app");if(tela){const sy=scrollY;render();scrollTo(0,sy);perfilJogador(p.id)}return;}
    case "invok":invIdx=0;modalInvestidor(1);return;
    case "invprox":invIdx=Math.min(2,invIdx+1);modalInvestidor(1);return;
    case "invant":invIdx=Math.max(0,invIdx-1);modalInvestidor(1);return;
    case "invdepois":fecharModal();G.investidor={pend:false,adiado:true};salvar();toast("Tudo bem! A proposta fica disponível na aba Upgrades.");break;
    case "invcompra":{const er=comprarSuper(+v,el.dataset.i==="troca");if(er){toastErro(er);return}fecharModal();salvar();render();const c=G.clubs[G.user.club];
      modal(`<h3>Bem-vindo à nova casa!</h3>${fotoSuper(G.estNovo,estadioDe(c))}<p style="margin-top:10px">O ${esc(c.name)} agora joga no <b>${esc(estadioDe(c))}</b>, com ${c.cap.toLocaleString("pt-BR")} lugares. Caixa atual: <b>${dinheiro(G.cash)}</b>.</p><div class="botoes"><button class="btn prim" data-a="fechar">Show!</button></div>`);confete();return;}
    case "pegaremp":{const o=opcoesEmprestimo()[+v];if(!o)return;modal(`<h3>Pegar empréstimo?</h3><div class="extrato num"><div><span>Valor no caixa agora</span><span>${dinheiro(o.v)}</span></div><div><span>Parcelas</span><span>${o.n}× de ${dinheiro(o.parc)}</span></div><div><span>Total a pagar</span><span>${dinheiro(o.total)}</span></div><div><span>Juros</span><span>${dinheiro(o.total-o.v)}</span></div></div><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn prim" data-a="empconf" data-v="${v}">Confirmar</button></div>`);return;}
    case "empconf":{fecharModal();const er=pegarEmprestimo(+v);(er?toastErro:toast)(er||"Dinheiro na conta!");salvar();break;}
    case "quitaremp":{const er=quitarEmprestimo(+v);(er?toastErro:toast)(er||"Empréstimo quitado.");salvar();break;}
    case "renovar":modalRenovar(+v);return;
    case "renovconf":{const er=renovar(+v,+el.dataset.i);fecharModal();if(er)toastErro(er);else toast("Contrato renovado.");salvar();break;}
    case "contratec":{const er=contratarTec(+v,el.dataset.i);if(er){toastErro(er);return}toast("Técnico contratado!");salvar();break;}
    case "vertec":aba="mercado";merc.orig="tec";window.scrollTo(0,0);break;
    case "demitec":modal(`<h3>Demitir ${esc(G.tec.n)}?</h3><p>A multa é de 6 meses de salário: ${dinheiro(Math.round(G.tec.sal*6))}. Um auxiliar assume como interino.</p><div class="botoes"><button class="btn" data-a="fechar">Cancelar</button><button class="btn perigo" data-a="demiteconf">Demitir</button></div>`);return;
    case "demiteconf":{fecharModal();const er=demitirTec();if(er)toastErro(er);salvar();break;}
    case "tutprox":G.tut=(G.tut||0)+1;salvar();if(G.tut<TUTORIAL.length){mostrarTutorial();return}fecharModal();return;
    case "tutpular":G.tut=TUTORIAL.length;salvar();fecharModal();return;
    case "entrar":abertura=false;aba="inicio";break;
    case "som":somIniciar();somMudo(!SOM.mudo);document.querySelectorAll(".som-btn").forEach(b=>{b.innerHTML=iconeSom();b.setAttribute("aria-label",SOM.mudo?"Ligar som":"Desligar som")});if(!SOM.mudo)somModo(modoDesejado());return;
    case "carregararq":{const i=$("#arq-save")||$("#arq-save2");if(i){i.value="";i.click()}return;}
    case "salvararq":salvarArquivo();return;
    case "vib":VIB_ON=!VIB_ON;try{localStorage.setItem("fut-vib",VIB_ON?"1":"0")}catch(e){}if(VIB_ON)vibrar("premio");if($("#splash")&&!$("#splash").hidden&&document.querySelector(".veu [data-a=vib]"))modalAjustesSp();else render();return;
    case "splregras":modalRegras();return;
    case "splajustes":modalAjustesSp();return;
    case "splsom":acao("som");modalAjustesSp();return;
    case "novacarreira":
      if(G){modal(`<h3>Começar nova carreira?</h3><p>A carreira atual (${esc(G.clubs[G.user.club].name)}, ${G.year}) será apagada deste aparelho. Para não perder, salve o arquivo antes.</p><div class="botoes" style="flex-wrap:wrap"><button class="btn" data-a="salvararq">Salvar arquivo</button><button class="btn" data-a="fechar">Cancelar</button><button class="btn perigo" data-a="novoconf">Apagar e começar</button></div>`);return}
      abertura=false;G=null;W=novoW();break;
  }
  render();
}
function handlers(root){
  root.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el||!root.contains(el)||el.disabled)return;e.stopPropagation();
    if(el.classList.contains("roda-it")&&!el.classList.contains("sel")){const r=el.parentNode;r.scrollTo({top:el.offsetTop+el.offsetHeight/2-r.clientHeight/2,behavior:"smooth"});somClique();return}
    const a=el.dataset.a,r=el.getBoundingClientRect(),c0=G?G.cash:0,k0=G?cupons():0;
    acao(a,el.dataset.v,el);
    if(G&&DIN_ACOES.has(a)&&(G.cash!==c0||cupons()!==k0))efeitoDinheiro(r,G.cash-c0,cupons()-k0);
    else if(!(abertura===false&&(a==="entrar"||a==="novacarreira")))somClique()});
}
handlers(app);handlers(nav);handlers($("#splash"));
document.addEventListener("change",e=>{if(e.target.id==="arq-save"||e.target.id==="arq-save2")lerArquivo(e.target.files&&e.target.files[0])});
document.addEventListener("change",e=>{if(e.target.id!=="ed-arq"||!editorOn)return;const pid=+e.target.dataset.pid,f=e.target.files&&e.target.files[0];
  processarRostoUpload(f,pid).then(r=>{G.rostosUp=G.rostosUp||{};G.rostosUp[pid]=r;const p=G.players[pid];if(p)delete p.rf;salvar();toast("Foto atualizada em todo o jogo!");render();modalEditorJog(pid)}).catch(m=>toast(m))});
document.addEventListener("change",e=>{if(e.target.id!=="edt-arq"||!editorOn)return;const n=e.target.dataset.n,f=e.target.files&&e.target.files[0];
  processarRostoUpload(f,0).then(r=>{G.tecFotos=G.tecFotos||{};G.tecFotos[n]={s:r.s};salvar();toast("Foto atualizada em todo o jogo!");render();modalEditorTec(n)}).catch(m=>toast(m))});
document.addEventListener("change",e=>{if(e.target.id!=="tec-arq")return;const n=e.target.dataset.n,f=e.target.files&&e.target.files[0];
  processarRostoUpload(f,0).then(r=>{G.tecFotos=G.tecFotos||{};G.tecFotos[n]={s:r.s};salvar();toast("Foto enviada!");const sy=scrollY;render();scrollTo(0,sy);modalRostoTec(n)}).catch(m=>toast(m))});
document.addEventListener("change",e=>{if(e.target.id!=="rosto-arq")return;const pid=+e.target.dataset.pid,f=e.target.files&&e.target.files[0];
  processarRostoUpload(f,pid).then(r=>{G.rostosUp=G.rostosUp||{};G.rostosUp[pid]=r;salvar();toast("Rosto enviado!");const sy=scrollY;render();scrollTo(0,sy);perfilJogador(pid)}).catch(m=>toast(m))});
window.addEventListener("resize",()=>{if(abertura){const cv=document.querySelector("#splash canvas");if(cv)pincel(cv)}});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.cor){
    const {e:es,u}=alvoVisual();const obj=t.dataset.cor==="escudo"?es:u;obj[t.dataset.k]=t.value;if(t.dataset.k==="c4")es.simCor="time";
    const code=t.parentElement.querySelector("code");if(code)code.textContent=t.value.toUpperCase();
    if(G&&t.dataset.cor==="escudo"){const c=G.clubs[G.user.club];c.c1=es.c1;c.c2=es.c2}
    atualizarPrevias();return;
  }
  if(t.dataset.escr){const {e:es}=alvoVisual();let p=+t.value;if(p!==50&&Math.abs(p-50)<=4){p=50;t.value=50}
    const mn=+t.dataset.min,mx=+t.dataset.max;es[t.dataset.escr]=Math.round((mn+(mx-mn)*p/100)*100)/100;const nb=t.parentElement.querySelector(".barra-num");if(nb)nb.textContent=p;atualizarPrevias();return}
  if(t.id==="esc-txt"){const {e:es}=alvoVisual();es.nomeTxt=t.value;atualizarPrevias();return}
  if(t.id==="ed-busca"){edSel.busca=t.value;const r=$("#ed-res"),nv=$("#ed-nav");if(r)r.innerHTML=edResultados();if(nv)nv.hidden=semAc(t.value).length>=2;return}
  if(t.id==="v-estadio"){const c=G.clubs[G.user.club];if(t.value.trim())c.estadio=t.value.trim();return}
  if(t.id==="v-nome"||t.id==="v-sigla"){const c=G.clubs[G.user.club];if(t.id==="v-nome"&&t.value.trim().length>=3)c.name=t.value.trim();if(t.id==="v-sigla"&&t.value.trim())c.short=t.value.trim().toUpperCase().slice(0,3);atualizarPrevias();return}
  if(["w-nome","w-tec","w-sigla","w-estadio"].includes(t.id))guardarW();
  if(t.id==="w-estadio"){const pe=$("#prev-estadio");}
  if(t.id==="v-estadio"){const pe=$("#prev-estadio");const c=G&&G.clubs[G.user.club];if(pe&&c)pe.innerHTML=fotoEstadio(G.reformas||0,t.value.trim()||estadioDe(c),c.cap)}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.escr||t.id==="esc-txt"){if(G)salvar();return}
  if(t.dataset.cor||t.id==="v-nome"||t.id==="v-sigla"||t.id==="v-estadio"){if(G)salvar();render();return}
  if(t.id==="sel-form"){G.user.form=t.value;autoEscalar();salvar();render()}
  else if(t.id==="sel-est"){G.user.est=t.value;salvar();render()}
  else if(t.id==="m-pos"){merc.pos=t.value;render()}
  else if(t.id==="m-min"){merc.min=+t.value;render()}
});
window.claude?.hot?.snapshot?.(()=>({G,W,aba,abertura}));
function iniciar(d){if(d&&(d.G||d.W)){G=migrar(d.G)||null;W=d.W&&d.W.unis?d.W:null;aba=d.aba||"inicio";abertura=d.abertura!==false;if(G&&G.v!==2)G=null}else carregar();render()}
window.claude?.hot?.ready?window.claude.hot.ready(iniciar):iniciar(window.claude?.hot?.data??{});
// tenta já abrir com a música da capa (se o navegador barrar, começa no primeiro toque)
try{somIniciar();somModo(modoDesejado())}catch(e){}

</script>
