<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUT Master</title><link rel="manifest" href="app/manifest.json"><link rel="apple-touch-icon" href="app/icon-180.png"><link rel="icon" href="app/icon-192.png"><meta name="theme-color" content="#0a1430"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FUT Master"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&family=Permanent+Marker&family=Archivo:wght@400;500;600;700;800&family=Bebas+Neue&family=Graduate&family=Russo+One&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}

/* Layout: app de uma coluna, cabeçalho de placar no topo e navegação fixa embaixo, em azul-escuro de estádio à noite */
:root{
  --gramado:#0a1430;      /* fundo: azul-escuro */
  --gramado-2:#111f45;    /* superfícies */
  --gramado-3:#1d3166;    /* bordas e linhas */
  --cal:#eef2fb;          /* texto principal */
  --cal-2:#9eafd2;        /* texto secundário */
  --canario:#ffd23f;      /* destaque */
  --canario-ink:#1a1400;
  --ok:#5fd38d; --ruim:#ff6b5b; --aviso:#ffb347; --azul:#6cb6ff;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--gramado);color:var(--cal);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100%}

/* cabeçalho placar */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--gramado);padding-block:12px 10px;border-bottom:1px solid var(--gramado-3);display:flex;align-items:center;gap:12px}
.escudo{width:42px;height:42px;flex:0 0 42px;border-radius:10px 10px 21px 21px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em;border:2px solid rgba(255,255,255,.25)}
.escudo.p{width:28px;height:28px;flex-basis:28px;font-size:11px;border-width:1.5px;border-radius:7px 7px 14px 14px}
.topo .info{min-width:0;flex:1}
.topo h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .sub{color:var(--cal-2);font-size:12.5px;letter-spacing:.03em}
.caixa{text-align:right;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.caixa small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--cal-2);letter-spacing:.06em;text-transform:uppercase}
.neg{color:var(--ruim)}

/* nav */
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--gramado-2);border-top:1px solid var(--gramado-3);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.abas .wrap{display:flex;width:100%;max-width:720px}
nav.abas button{flex:1;background:none;border:0;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--cal-2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.abas button svg{width:22px;height:22px}
nav.abas .wrap{gap:0;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}nav.abas .wrap::-webkit-scrollbar{display:none}nav.abas .wrap button{flex:0 0 auto;min-width:58px;font-size:10.5px;padding-inline:4px;letter-spacing:-.01em;scroll-snap-align:start}
nav.abas button[aria-current="true"]{color:var(--canario)}
nav.abas button[data-v="jogar"] svg{width:26px;height:26px;color:var(--canario)}
nav.abas button[data-v="jogar"]{color:var(--cal)}
nav.abas button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--canario);outline-offset:2px}

h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--cal-2);margin:24px 0 10px}
.secao{display:flex;flex-direction:column;gap:10px}
.cartao{background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:14px;padding:14px}
.linha{display:flex;align-items:center;gap:10px}
.muted{color:var(--cal-2)}
.peq{font-size:12.5px}

.btn{background:var(--gramado-3);border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--cal-2)}
.btn.prim{background:var(--canario);color:var(--canario-ink);font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.btn.prim:not(:disabled),.btn.prim-mini:not(:disabled){position:relative;overflow:hidden;isolation:isolate}
@media (prefers-reduced-motion:no-preference){
 .btn.prim:not(:disabled){animation:btnBrilho 1.8s ease-in-out infinite,btnVibra 4s ease-in-out infinite}
 .btn.prim:not(:disabled)::after,.btn.prim-mini:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:btnReflexo 2.6s ease-in-out infinite;pointer-events:none;z-index:1}
 .btn.prim-mini:not(:disabled){animation:btnBrilho 1.8s ease-in-out infinite}
 nav.abas button[data-v="jogar"] svg{animation:jogarPulsa 1.6s ease-in-out infinite}
 @keyframes btnBrilho{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.55),0 4px 14px rgba(255,210,63,.25)}50%{box-shadow:0 0 0 6px rgba(255,210,63,0),0 6px 26px rgba(255,210,63,.6)}}
 @keyframes btnVibra{0%,86%,100%{transform:none}88%{transform:rotate(-1.2deg) scale(1.02)}90%{transform:rotate(1.2deg) scale(1.02)}92%{transform:rotate(-1deg)}94%{transform:rotate(.8deg)}96%{transform:none}}
 @keyframes btnReflexo{0%{left:-60%}55%,100%{left:130%}}
 @keyframes jogarPulsa{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,210,63,0))}50%{transform:scale(1.15);filter:drop-shadow(0 0 6px rgba(255,210,63,.9))}}
}
.btn.prim:not(:disabled):active{transform:scale(.97)}
.btn.prim:hover{filter:brightness(1.06);border-color:transparent}
.btn.mini{min-height:34px;padding:6px 10px;font-size:13px}
.btn.perigo{color:var(--ruim)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}

/* próximo jogo */
.confronto{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.confronto .time{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.confronto .time b{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.placar{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.02em}
.placar .x{color:var(--cal-2);font-size:24px;margin-inline:6px}
.gols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13px;color:var(--cal-2)}
.gols div:last-child{text-align:right}

.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--gramado-3);font-size:14px;align-items:center}
.res:last-child{border-bottom:0}
.res .c{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:56px;text-align:center}
.res span:last-child{text-align:right}
.res.meu{color:var(--canario)}

/* tabela */
.seg{display:flex;background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--cal-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gramado-3);color:var(--cal)}
.rolar{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cal-2);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--gramado-3)}
td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--gramado-3);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
td.pos{text-align:center;width:30px;font-family:var(--f-display);font-weight:700;font-size:15px}
td.pts{font-weight:700}
tr.meu td{color:var(--canario)}
.z-sobe td.pos{box-shadow:inset 3px 0 0 var(--ok)}
.z-cai td.pos{box-shadow:inset 3px 0 0 var(--ruim)}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--cal-2);flex-wrap:wrap}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* elenco */
.jog{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--gramado-3)}
.jog:last-child{border-bottom:0}
.posb{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.05em;text-align:center;border-radius:6px;padding:3px 0;background:var(--gramado-3)}
.posb.GOL{background:#5b4a12;color:#ffe08a}.posb.LAT,.posb.ZAG{background:#14405e;color:#a8dcff}
.posb.VOL,.posb.MEI{background:#1f5a33;color:#b9f5cc}.posb.ATA{background:#5e1f1a;color:#ffb8ad}
.jog .nm{min-width:0}
.jog .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jog .nm span{font-size:12px;color:var(--cal-2)}
.ov{font-family:var(--f-display);font-weight:800;font-size:18px;width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;text-align:center;justify-self:end;background:radial-gradient(circle at 35% 30%,#3d63c9,#1b3684);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.35);position:relative}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.les{background:rgba(255,107,91,.18);color:var(--ruim)}
.tag.venda{background:rgba(255,210,63,.16);color:var(--canario)}
.slot{cursor:pointer;background:none;border:0;border-bottom:1px solid var(--gramado-3);width:100%;text-align:left;color:inherit}
.slot:hover .nm b{color:var(--canario)}
.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.expand{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}

.campo-sel{display:flex;gap:8px;flex-wrap:wrap}
.campo-sel label{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--cal-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
select,input[type=text],input[type=number],textarea{background:var(--gramado);border:1px solid var(--gramado-3);border-radius:10px;padding:10px;min-height:42px;width:100%;color:var(--cal)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:11px;min-height:120px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--canario)}

/* forças */
.forca{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;color:var(--cal-2)}
.barra{height:8px;border-radius:4px;background:var(--gramado);overflow:hidden}
.barra i{display:block;height:100%;background:var(--canario)}

/* caixa de entrada */
.msg{border-left:3px solid var(--gramado-3);padding:4px 0 4px 10px;font-size:14px}
.msg.oferta{border-left-color:var(--canario)}
.msg.ruim{border-left-color:var(--ruim)}
.msg.bom{border-left-color:var(--ok)}

/* fundação */
.fund{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.fund .marca{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,76px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.fund .marca em{font-style:normal;color:var(--canario)}
.fund p{margin:0;max-width:52ch;color:var(--cal-2);font-size:18px}
.fund .campo>span{font-size:15px}.fund input[type=text]{font-size:19px;min-height:54px}
.fund .passos{grid-template-columns:repeat(5,1fr)}.fund .passos li{font-size:15px}.fund .passos li b{font-size:20px}
.fund-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
.fund{z-index:1}
.rot-info{display:flex;align-items:center;gap:8px}.rot-info label{cursor:pointer}
.info-bt{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--canario);color:var(--canario);font:italic 800 13px/22px Georgia,serif;text-align:center;text-transform:none;letter-spacing:0}
.fontes-esc{flex-wrap:wrap}.fontes-esc button{flex:1 1 30%}
.lista-info{margin:6px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cores{display:flex;gap:8px;flex-wrap:wrap}
.cores button{width:36px;height:36px;border-radius:50%;border:2px solid var(--gramado-3);cursor:pointer}
.cores button[aria-pressed="true"]{border-color:var(--canario);box-shadow:0 0 0 3px var(--gramado),0 0 0 5px var(--canario)}
.opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opcoes button{background:var(--gramado-2);border:1.5px solid var(--gramado-3);border-radius:12px;padding:12px 8px;cursor:pointer;text-align:left}
.opcoes button b{display:block;font-family:var(--f-display);font-size:20px}
.opcoes button span{font-size:12px;color:var(--cal-2)}
.opcoes button[aria-pressed="true"]{border-color:var(--canario)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cal-2)}
.dupla{display:grid;grid-template-columns:2fr 1fr;gap:10px}

/* modal */
.veu{position:fixed;inset:0;z-index:60;background:rgba(3,8,22,.75);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:86%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.folha h3{margin:0 0 6px;font-family:var(--f-display);font-size:24px;font-weight:700}
.folha .botoes{display:flex;gap:8px;margin-top:16px}
.folha .botoes .btn{flex:1}
@media (min-width:700px){.veu{align-items:center}.folha{border-radius:18px}}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cal-2);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:700}
.extrato div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--gramado-3);font-size:14px}
.extrato div:last-child{border-bottom:0;font-weight:700}
.hist td:nth-child(2){text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--cal);color:var(--gramado);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.placar.anim{animation:pulo .5s ease-out}@keyframes pulo{from{transform:scale(.7);opacity:.2}to{transform:none;opacity:1}}}

.esc-topo{display:flex;flex:0 0 auto}
.svg-escudo{display:block;overflow:visible}
.passos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.passos li{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--cal-2);border-top:3px solid var(--gramado-3);padding-top:6px}
.passos li b{font-family:var(--f-display);font-size:16px}
.passos li.feito{border-top-color:var(--ok);color:var(--cal)}
.passos li[aria-current="step"]{border-top-color:var(--canario);color:var(--canario)}
.paises{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pais{background:var(--gramado-2);border:1.5px solid var(--gramado-3);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:13px}
.pais b{font-family:var(--f-display);font-size:22px;font-weight:700}
.pais[aria-pressed="true"]{border-color:var(--canario);background:var(--gramado-3)}
.previa{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--gramado-3),var(--gramado-2) 70%);border:1px solid var(--gramado-3);border-radius:16px;padding:18px;min-height:170px}
.grade8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade8 button{background:var(--gramado-2);border:1.5px solid var(--gramado-3);border-radius:12px;padding:8px 4px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.grade8 button small{font-size:11px;color:var(--cal-2);line-height:1.2;text-align:center}
.grade8 button[aria-pressed="true"]{border-color:var(--canario)}
.grade8 button[aria-pressed="true"] small{color:var(--canario)}
.fund.p3 .grade8 button{background:rgba(10,20,48,.12);border:1.5px solid rgba(255,255,255,.85)}
.fund.p3 .grade8 button[aria-pressed="true"]{border-color:var(--canario);background:rgba(245,197,24,.12)}
.fund.p3 .grade8 button small{color:#fff;text-shadow:0 1px 3px #000}
.esc-cab{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;border:1.5px solid rgba(255,255,255,.85);border-radius:12px;background:rgba(10,20,48,.25)}
.esc-cab span{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em;color:#fff}
.esc-cab small{flex:1;text-align:right;color:var(--canario);font-weight:600;font-size:14px}
.esc-cab b{color:#fff;font-size:14px}
.esc-sec.aberto .esc-cab{border-color:var(--canario)}
.esc-sec.aberto{gap:10px}
.esc-sec{border:1.5px solid rgba(255,255,255,.85);border-radius:12px;background:rgba(10,20,48,.25);padding:4px 10px 10px}
.esc-sec .esc-cab{border:0;background:none;padding:12px 6px}
.esc-sec.aberto{border-color:var(--canario)}
.esc-cor{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 6px}
.esc-cor>span{font-size:12px;color:rgba(255,255,255,.75);text-transform:uppercase;letter-spacing:.06em}
.chip-cor{position:relative;display:flex;align-items:center;gap:8px;padding:6px 12px;border:1.5px solid rgba(255,255,255,.85);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.chip-cor input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chip-cor em{width:18px;height:18px;border-radius:50%;border:1.5px solid #fff}
.sc-fundo{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.sc-caixa{width:100%;max-width:380px;background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sc-tit{font-family:var(--f-display);font-size:22px;text-transform:uppercase}
.sc-sv{position:relative;height:220px;border-radius:12px;touch-action:none;cursor:crosshair}
.sc-hue{position:relative;height:26px;border-radius:13px;touch-action:none;cursor:pointer;background:linear-gradient(to right,red,#ff0,lime,cyan,blue,#f0f,red)}
.sc-pino{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.5);pointer-events:none}
.sc-hue .sc-pino{top:50%}
.sc-baixo{display:flex;align-items:center;gap:12px}.sc-amostra{width:44px;height:44px;border-radius:10px;border:2px solid #fff}.sc-hex{font-size:18px}
.esc-cor .chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
/* cards do escudo mais baixos e compactos */
.fund .esc-sec{padding:0 10px 8px;gap:4px}
.fund .esc-sec .esc-cab{padding:8px 4px}

const rnd=()=>RNG();

function gauss(){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function poisson(l){const L=Math.exp(-l);let k=0,p=1;do{k++;p*=rnd()}while(p>L);return k-1}
const econ=r=>Math.exp((r-50)/6.5);

function siglaDe(nome){
  let s=nome.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g," ").replace(/[.'&]/g," ");
  let w=s.split(/[\s-]+/).filter(x=>x&&!/^(fc|afc|sc|sv|us|as|cf|cd|ud|vfb|vfl|tsg|tsv|ssv|de|del|da|do|y|e|la|le|les|el|los|the|of|and|hove|albion|1|91|43|05|04|96|98)$/i.test(x));
  if(!w.length)w=[s.trim()||"CLB"];
  const r=(w.length>=2&&w[1].length>=2&&!/^\d/.test(w[1]))?w[0][0]+w[1].slice(0,2):w[0].slice(0,3);
  return r.toUpperCase().padEnd(3,"X");
}
function corHash(nome,i){const P=["#c8102e","#0047ab","#00843d","#151515","#f5d000","#7a0026","#e8590c","#5b2a86"];let h=0;for(const c of nome)h=(h*31+c.charCodeAt(0))>>>0;return P[(h+i*3)%P.length]}
const ABREV_FIXO={"Deportivo Madryn":"Deportivo Mad.","Deportivo Maipú":"Deportivo Mai.","Deportivo Morón":"Deportivo Mo.","Real Murcia":"Real Mu.","Universidad Católica":"Universidad Ca.","Universidad de Chile":"Universidad Ch.","Guaraní":"Guaraní PY","Sporting CP":"Sporting P."};
function abreviar(nome){
  if(ABREV_FIXO[nome])return ABREV_FIXO[nome];
  const m=nome.match(/^(.*?)\s*(\([^)]*\))\s*$/);
  const base=m?m[1]:nome,par=m?" "+m[2]:"";
  const partes=base.split(/[\s-]+/).filter(Boolean);
  const curta=w=>w.length<=5?w:w.slice(0,w.length-2)+".";
  if(partes.length===1)return curta(partes[0])+par;
  const resto=partes.slice(1).filter(w=>!/^(de|del|da|do|y|e|&|and|of|the)$/i.test(w));
  const seg=resto[0]||partes[1];
  return partes[0]+" "+(/^\d/.test(seg)?seg:seg[0].toUpperCase()+".")+par;
}
function parseClube(s){const [n,r,c1,c2,pais]=s.split("|");return {name:n,rating:+r,c1:c1?"#"+c1:corHash(n,0),c2:c2?"#"+c2:"#ffffff",pais}}

function nomeJogador(ling){
  let l=ling||"pt";
  if(rnd()<(l==="pt"?.012:.03))l=rnd()<.6?"jp":"kr";
  if(l==="pt"&&rnd()<.15)return pick(NOMES.pt)+" "+pick(["Paulista","Baiano","Mineiro","Gaúcho","Carioca","Paraíba","Capixaba","Goiano","Paraense"]);
  return pick(NOMES[l])+" "+pick(SOBRENOMES[l]);
}
function valorDe(ov,age,pot){
  let f=age<=20?1.5:age<=23?1.3:age<=28?1:age<=30?.8:age<=32?.55:.3;
  if(age<=23&&pot>ov)f*=1+(pot-ov)*.03;
  return Math.max(10,Math.round(90*econ(ov)*f/5)*5);

function folhaMensal(){const j=Math.round(folhaSalarial(G.user.club)*10)/10,t=G.tec&&!G.tec.interino?G.tec.sal:0,f=custoFixo(),e=Math.round(parcelasEmp()*10)/10;return {j,t,f,e,tot:Math.round((j+t+f+e)*10)/10}}
const JURO_MES=.029;
function opcoesEmprestimo(){
  const F=folhaMensal(),base=Math.max(50,Math.round((F.j+F.t+F.f)/10)*10);
  const devendo=(G.emp||[]).reduce((s,e)=>s+e.parc*e.rest,0),lim=base*6-devendo;
  return [[1,6],[2,10],[4,12]].map(([mult,n])=>{const v=Math.round(base*mult/10)*10;const parc=Math.round(v*JURO_MES/(1-Math.pow(1+JURO_MES,-n))*10)/10;return {v,n,parc,total:Math.round(parc*n),ok:v<=lim}});
}
function pegarEmprestimo(i){
  const o=opcoesEmprestimo()[i];if(!o)return "Opção indisponível.";
  if(!o.ok)return "O banco não libera esse valor: o clube já deve muito.";
  (G.emp=G.emp||[]).push({v:o.v,parc:o.parc,rest:o.n,n:o.n,ano:G.year});G.cash+=o.v;
  G.inbox.unshift({t:"bom",m:`Empréstimo aprovado: ${dinheiro(o.v)} no caixa. ${o.n} parcelas de ${dinheiro(o.parc)} junto com a folha mensal.`});
  return null;
}
function quitarEmprestimo(i){

  const saldo=Math.round(e.parc*e.rest*.94);if(saldo>G.cash)return `Faltam ${dinheiro(saldo-G.cash)} para quitar.`;
  G.cash-=saldo;G.emp.splice(i,1);G.inbox.unshift({t:"bom",m:`Empréstimo quitado por ${dinheiro(saldo)} (desconto de 6% nos juros por antecipar).`});return null;
}

/* ---------- dinheiro por partida ---------- */
const FREC=[.22,.38,1];
function eRec(t){return (G.econ[t]||1)*(FREC[t]??1)}
function premioPartida(e,res){const f=G&&G.econ&&e===G.econ[2]?.75:1;return Math.round(e*(res==="v"?40:res==="e"?18:7)*f)}
function receitaPartida(r,e,ehCopa){
  const uid=G.user.club,casa=r.h===uid;
  const gu=casa?r.gh:r.ga,go=casa?r.ga:r.gh;
  const res=gu>go?"v":gu===go?"e":"d";
  const c=G.clubs[uid],adv=G.clubs[casa?r.a:r.h];
  const fin={res,premio:premioPartida(e,res),bil:0,pub:0,patro:0,bonus:0,casa,imp:"normal"};
  // importância do jogo: adversário forte, topo da tabela e copa enchem o estádio
  let imp=0;const ev=G.cal[G.ev]||{};
  if(ev.k==="C")imp+=ev.d<6?.4:.55+.1*(ev.d-6);          // Libertadores/Champions: mata-mata e final lotam
  else if(ev.k==="N")imp+=.12+.07*(ev.d||0);             // copa nacional: cresce a cada fase
  if(adv.rating>=c.rating+4)imp+=.15;else if(adv.rating<=c.rating-6)imp-=.1;
  if(ev.k==="L"&&G.ev>2){const n=G.tiers[c.tier].length,pa=posicaoDe(adv.id),pu=posicaoDe(uid);
    if(pa<=4)imp+=.25;else if(pa>n-4)imp-=.1;if(pu<=4)imp+=.1;
    const R=nRodadas();if(ev.r>=R-6&&pu<=6)imp+=.12;}      // reta final brigando pelo acesso/título
  {const dt=dataEv(G.ev);if(dt&&dt.getDay()===3)imp-=.05}   // jogo em quarta-feira à noite
  fin.imp=imp>=.3?"grande":imp<=-.05?"pequeno":"normal";
  const neutro=r.neutroFinal;
  const cap=neutro?60000:G.clubs[r.h].cap;
  const refE=casa?(G.reformas||0):0; // estádio reformado atrai mais torcida e cobra ingresso mais caro
  const fill=clamp(.8+imp*.28+(casa?(c.fama||0)/1000:0)+refE*.008+gauss()*.035,.66,1);
  const pub=Math.round(fill*cap);
  const preco=18*Math.sqrt(e)*(1+Math.max(imp,0)*.6)*(1+refE*.05)*(.9+rnd()*.25);
  const fBil=[.27,.36,.27][c.tier]??.6;
  if(casa||neutro){fin.pub=neutro?Math.round(pub/2):pub;fin.bil=Math.round(fin.pub*preco/1000*fBil)}
  else{fin.bil=Math.round(pub*preco/1000*.1);fin.cota=true}
  if(G.patro){fin.patro=G.patro.porJogo;if(G.patro.tipo==="vitoria"&&res==="v")fin.bonus=G.patro.bonus}
  return fin;
}
function aplicarFin(fin,ehRodadaLiga){
  const uid=G.user.club,c=G.clubs[uid];
  // gastos do dia de jogo (em mil): C 15/10, B 30/20, A 50/35 (casa/fora)
  const GASTOS=[[50,35],[30,20],[15,10]],gt=GASTOS[c.tier]||GASTOS[2];
  fin.sal=ehRodadaLiga?-Math.round((fin.casa?gt[0]:gt[1])*escalaPais(c.tier)):0;
  fin.man=0;
  fin.tot=fin.premio+fin.bil+fin.patro+fin.bonus+fin.sal+fin.man;
  G.cash+=fin.tot;G.lastFin=fin;
  if(fin.res==="v")c.fama=clamp((c.fama||0)+.5,0,100);else if(fin.res==="e")c.fama=clamp((c.fama||0)+.15,0,100);
}


/* ---------- evolução dos jogadores do usuário ---------- */
function xpNecessario(p){return Math.round(60+(p.ov-40)*2.2)}
function evoluir(r){
  const uid=G.user.club,casa=r.h===uid;
  const gf=casa?r.gh:r.ga,gs=casa?r.ga:r.gh;
  const res=gf>gs?"v":gf===gs?"e":"d";
  const sc=casa?r.sh:r.sa;
  const marcou={};sc.forEach(([id])=>marcou[id]=(marcou[id]||0)+1);
  const lista=r.part||G.user.lineup.map((id,i)=>[id,FORMACOES[G.user.form].s[i],90]).filter(x=>x[0]!=null);
  const subiram=[];
  const def={GOL:1,ZAG:.85,LAT:.7,VOL:.5,MEI:.15,ATA:0};
  const atk={GOL:0,ZAG:.1,LAT:.35,VOL:.4,MEI:.75,ATA:1};
  const ganho={};
  lista.forEach(([id,s,mins])=>{
    const p=G.players[id];if(!p||p.club!==uid)return;
    let x=2+(res==="v"?2:res==="e"?1:0);
    if(gs===0)x+=6*def[s];
    else if(gs>=3)x-=2*def[s];
    x+=Math.min(gf,4)*2*atk[s];
    if(gf===0)x-=1.5*atk[s];
    x+=(marcou[id]||0)*4;
    const fAge=p.age<=23?1.4:p.age<=29?1:.6;
    ganho[id]=Math.max(0,x*fAge)*clamp(mins/90,.25,1)*(G.tec?.55+G.tec.q/150:.95);
  });
  jogadoresDo(uid).forEach(p=>{
    const g=ganho[p.id]!=null?ganho[p.id]:.6;
    p.xp=(p.xp||0)+g;
    const need=xpNecessario(p);
    if(p.xp>=need&&p.ov<94){p.xp-=need;p.ov++;if(p.pot<p.ov)p.pot=p.ov;subiram.push(p)}
  });
  return {ganho,subiram};
}

function avancar(meuRes){
  tocou();

  if(G.fase!=="jogo")return null;
  const ev=proximoEvento();if(!ev)return null;

    if(trocas.length)msgs.push({t:"ruim",m:`${trocas.join(", ")} ${trocas.length>1?"estavam fora e foram substituídos":"estava fora e foi substituído"} na escalação.`});}

  else if(ev.k==="C")out=rodadaCopa(ev.d,msgs,meuRes);
  else if(ev.k==="N")out=rodadaCopaN(ev.d,msgs,meuRes);
  {const dt=dataEv(G.ev);
   if(dt){const t=dt.getTime();
     if(!G.pag||G.pag.y!==G.year){G.pag={y:G.year,dia:dt.getDate(),prox:maisUmMes(t,dt.getDate()),n:0}}
     else{let n=0;while(t>=G.pag.prox&&n<3){const F=folhaMensal();G.cash-=F.tot;n++;G.pag.n=(G.pag.n||0)+1;
       (G.emp||[]).forEach(e=>e.rest--);G.emp=(G.emp||[]).filter(e=>e.rest>0);
       (G.pagHist=G.pagHist||[]).unshift({d:G.pag.prox,...F});G.pagHist=G.pagHist.slice(0,8);
       if(G.cash<0)G.alertaFolha=true;
       msgs.push({t:"ruim",m:`Folha mensal paga: ${dinheiro(F.tot)} (jogadores ${dinheiro(F.j)}, técnico ${dinheiro(F.t)}, funcionários e contas ${dinheiro(F.f)}${F.e?`, empréstimo ${dinheiro(F.e)}`:""}).`});
       if(meuRes&&G.lastFin){G.lastFin.folha=-F.tot;G.lastFin.tot-=F.tot}
       G.pag.prox=maisUmMes(G.pag.prox,G.pag.dia)}}}}
  G.ev++;
  {// lesão só conta partida quando o clube do jogador joga; energia volta a 100% antes de cada partida (lesionado fica como está)
   const d0=dataEv(G.ev-1),d1=dataEv(G.ev),dias=d0&&d1?clamp(Math.round((d1-d0)/864e5),1,10):4,uid=G.user.club;
   Object.values(G.players).forEach(p=>{
     if(p.inj>0&&(p.club==null||JOGARAM.has(p.club))){p.inj--;if(p.inj===0&&p.club===uid)msgs.push({t:"bom",m:`${p.n} está recuperado da lesão e volta a ficar disponível.`})}
     if(!(p.inj>0))p.fis=100});
   JOGARAM=null;}
  movimentoIA();
  const prox=proximoEvento();
  if(prox&&prox.k==="W"){G.ev++;abrirJanelaMeio(msgs)}
  G.inbox=msgs.concat(G.inbox).slice(0,40);
  if(!proximoEvento())G.seasonEnd=fecharTemporada();

}
function rodadaLiga(r,msgs,meuRes){
  const uid=G.user.club;let meu=null;
  for(let t=0;t<3;t++){
    const rs=G.fix[t][r].map(([h,a])=>{const x=(meuRes&&(h===uid||a===uid))?meuRes:simular(h,a);registrar(x);if(h===uid||a===uid)meu=x;return x});
    G.res[t][r]=rs.map(x=>[x.h,x.a,x.gh,x.ga]);
  }
  const fin=receitaPartida(meu,eRec(userTier()),false);aplicarFin(fin,true);
  const ev=evoluir(meu);meu.evo=ev;
  ev.subiram.forEach(p=>msgs.push({t:"bom",m:`${p.n} evoluiu para ${p.ov} de força.`}));
  meu.les.forEach(id=>{const p=G.players[id];if(p.club===uid)msgs.push({t:"ruim",m:`${p.n} se machucou e fica fora por ${p.inj-1} jogo${p.inj-1>1?"s":""}.`})});
  G.last={...meu,tipo:"L",rodada:r+1,pts:fin.res==="v"?3:fin.res==="e"?1:0};
  noticiasRodada(r);
  return meu;
}

function substituir(s,i,inId,silencioso,mot){

function melhorReserva(s,pos){let b=null,bv=-1;bancoDe(s).forEach(p=>{const v=ovF(p)*eficiencia(p,pos);if(v>bv){bv=v;b=p}});return b}
/* comando do técnico: lesão > cansaço > ajuste tático, sem parar o relógio */
function tecnicoAgir(s){
  const V=G.live,L=V.L[s],sl=FORMACOES[L.form].s;if(L.subs>=MAX_SUBS)return;
  for(let i=0;i<sl.length;i++)if(L.xi[i]==null&&!L.bloq[i]){const q=melhorReserva(s,sl[i]);if(q){substituir(s,i,q.id,false,"lesão");return}}
  if(V.min<46||V.min>=88||(L.ult&&V.min-L.ult<4))return;
  if(MAX_SUBS-L.subs<=(V.min<80?1:0))return; // guarda uma troca para lesões
  const ef=(p,i)=>ovF(p)*eficiencia(p,sl[i]);
  const cans=L.xi.map((id,i)=>[G.players[id],i]).filter(([p,i])=>p&&sl[i]!=="GOL"&&(p.fis??100)<(V.min>=70?55:45)).sort((a,b)=>a[0].fis-b[0].fis);
  for(const [p,i] of cans){const q=melhorReserva(s,sl[i]);if(q&&ef(q,i)>=ef(p,i)-3){substituir(s,i,q.id,false,"cansaço");L.ult=V.min;return}}
  const dif=(s==="h"?V.gh-V.ga:V.ga-V.gh);
  if(dif<0&&V.min>=62&&!L.tatOf){L.tatOf=1;
    const alvo=L.xi.map((id,i)=>[G.players[id],i]).filter(([p,i])=>p&&["VOL","ZAG","LAT"].includes(sl[i])).sort((a,b)=>ef(a[0],a[1])-ef(b[0],b[1]))[0];
    const q=bancoDe(s).filter(p=>p.pos==="ATA"||p.pos==="MEI")[0];
    if(alvo&&q&&ovF(q)>=ef(alvo[0],alvo[1])-2){substituir(s,alvo[1],q.id,false,"ajuste tático: mais ataque");L.ult=V.min}
    if(L.est!=="of")trocarFormacao(s,null,"of");return}
  if(dif===1&&V.min>=78&&!L.tatDef){L.tatDef=1;if(L.est!=="def")trocarFormacao(s,null,"def");

const XP_RES={v:50,e:25,d:10};
function xpParaSubir(n){return Math.round((n<=1?50:200+50*(n-2))*1.3/5)*5} // +30% de XP por nível
function perfil(){if(!G.perfil)G.perfil={xp:0,nivel:1,j:0,v:0,e:0,d:0,gp:0,gc:0,aviso:null,dica:false};return G.perfil}
const NIVEL_MAX=30;
/* prêmio em dinheiro (em mil) ao chegar em cada nível: cresce aos poucos até 5 milhões no nível 30 (base Brasil; outros países ajustados pela economia do país, escalaFund) */
const PREMIO_N30=5000;

function premioBase(n){const base=[0,0,5,8,12,18];let v;if(n<=5)v=base[n];else{v=18;let d=6;for(let k=6;k<=n;k++){d+=1;v+=d}}return v*1.3}

function somarXP(qtd){
  const P=perfil(),antes=P.nivel;let dinheiroGanho=0,cuponsGanhos=0;

  return {antes,nivel:P.nivel,premio:dinheiroGanho};
}
function ganharXP(gf,gs,dobro){
  const P=perfil(),r=gf>gs?"v":gf<gs?"d":"e",ganho=XP_RES[r]*(dobro?2:1);

function listaTec(){const E=G.tecEdit||{};return TECNICOS[G.country].split(",").map(s=>{const [n,q]=s.split("|");return {n,q:E[n]&&E[n].q!=null?E[n].q:+q}})}

function pedidoRenovacao(p,anos){const s=Math.round(Math.max(p.sal,salarioDe(p.ov))*(1.05+.04*anos)*10)/10;return {sal:s,luvas:Math.round(s*2)}}

function mercadoIA(n){

function candidatosSerie(t,lo,hi){const uid=G.user.club;return G.tiers[t].filter(id=>id!==uid).flatMap(id=>jogadoresDo(id)).filter(p=>p.ov>=lo&&p.ov<=hi&&p.inj<=0)}
/* jogadores sorteados de qualquer série (A, B ou C), bons e ruins, posições variadas */

function minhaSerie(){return G.clubs[G.user.club].tier}
function naLibertadores(){const uid=G.user.club;return !!(G.cup&&G.cup.tipo==="main"&&G.cup.groups&&G.cup.groups.flat().includes(uid))}
// de quantas em quantas trocas da loja aparece lenda: Série C nunca; B a cada 5; A a cada 3; A com Libertadores/Champions a cada 2
function intervaloLenda(){const t=minhaSerie();return t>=2?0:t===1?5:naLibertadores()?2:3}
const RECUSA="__recusa__";
function recusaJogador(nome,frase){modal(`<h3>${esc(nome)} recusou</h3><p class="fala-jog">“${frase}”</p><div class="botoes"><button class="btn prim" data-a="fechar">Entendi</button></div>`);somErro();return RECUSA}
function sortearJogadoresMercado(n){
  const POS=["GOL","LAT","ZAG","VOL","MEI","ATA"],out=[];let tent=0;
  const serieB=minhaSerie()===1;
  while(out.length<n&&tent++<60){const t=serieB?pick([0,0,1,1,1,2]):ri(0,2),b=G.tierBase[t],pos=pick(POS),faixa=rnd();
    // na Série B, da Série C só aparecem os destaques
    const [lo,hi]=serieB&&t===2?[b+5,b+14]:faixa<.3?[b-12,b-4]:faixa<.75?[b-4,b+3]:[b+3,b+12];
    const c=candidatosSerie(t,lo,hi).filter(p=>p.pos===pos&&!out.includes(p.id));if(c.length)out.push(pick(c).id)}
  return out;
}
function ofertaJanela(){return sortearJogadoresMercado(5)}
function ofertaJanelaAntiga(){
  const uid=G.user.club,el=jogadoresDo(uid),r=G.clubs[uid].rating||55;
  const melhor={};["GOL","LAT","ZAG","VOL","MEI","ATA"].forEach(pos=>{melhor[pos]=Math.max(0,...el.filter(p=>p.pos===pos).map(p=>p.ov))});
  const ordem=Object.keys(melhor).sort((a,b)=>melhor[a]-melhor[b]);
  const series=[2,2,1,1,0],out=[];
  series.forEach((t,i)=>{const pos=ordem[i%ordem.length];
    let c=candidatosSerie(t,Math.max(r-2,melhor[pos]-2),r+9).filter(p=>p.pos===pos&&!out.includes(p.id));
    if(!c.length)c=candidatosSerie(t,r-3,r+9).filter(p=>!out.includes(p.id));
    if(c.length)out.push(pick(c).id)});
  return out;
}

const LOJA_MS=2*3600*1000;
function cicloLoja(){return Math.floor(Date.now()/LOJA_MS)}
function msParaRenovar(){return LOJA_MS-(Date.now()%LOJA_MS)}

function montarCopa(nc){

}
const PAD_GRUPO=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]],[[1,0],[3,2]],[[2,0],[3,1]],[[3,0],[2,1]]];
const FASES_KO=["Oitavas de final","Quartas de final","Semifinal","Final"];
const FASES_NA=["nas oitavas de final","nas quartas de final","na semifinal","na final"];
function grupoOrdenado(g){return ordenar(g,G.cup.gst)}
function jogoCopa(h,a,ko,neutro){
  const x=simular(h,a,neutro,false);
  if(ko&&x.gh===x.ga){const ph=.5+(x.fh-x.fa)/400;x.pen=rnd()<ph?"h":"a"}
  return x;
}
function vencedorKO(x){return x.gh>x.ga||(x.gh===x.ga&&x.pen==="h")?x.h:x.a}
function diaCopa(d,meuRes){
  const cup=G.cup,uid=G.user.club;let meu=null;const lista=[];

      H.j++;A.j++;H.gp+=x.gh;H.gc+=x.ga;A.gp+=x.ga;A.gc+=x.gh;
      if(x.gh>x.ga){H.v++;H.pts+=3;A.d++}else if(x.gh<x.ga){A.v++;A.pts+=3;H.d++}else{H.e++;A.e++;H.pts++;A.pts++}
      lista.push(x);if(x.h===uid||x.a===uid)meu=x}));
    cup.fase=d<5?"Fase de grupos":"Oitavas de final";
    if(d===5){
      const cl=cup.groups.map(grupoOrdenado);
      const pares=[];for(let i=0;i<8;i+=2){pares.push([cl[i][0],cl[i+1][1]]);pares.push([cl[i+1][0],cl[i][1]])}
      cup.ko[0]=pares;
      if(!cl.some(g=>g.slice(0,2).includes(uid))&&cup.groups.some(g=>g.includes(uid)))cup.out="grupos";
    }

function rodadaCopa(d,msgs,meuRes){

    its.forEach(it=>{const d=Math.abs(it.offsetTop+it.offsetHeight/2-m);const k=Math.min(d/it.offsetHeight,1.5);it.style.setProperty("--k",k.toFixed(2));if(d<d0){d0=d;melhor=it}});
    if(r._sel&&melhor!==r._sel){somRoleta();vibrar("roleta")}r._sel=melhor;
    its.forEach(it=>it.classList.toggle("sel",it===melhor))};
  let tq=0;r.addEventListener("scroll",()=>{marca();cancelAnimationFrame(tq);tq=requestAnimationFrame(marca)},{passive:true});
  requestAnimationFrame(()=>{const i0=its[0];r.scrollTop=i0.offsetTop+i0.offsetHeight/2-r.clientHeight/2;marca()});

let invIdx=0;
function modalInvestidor(etapa){
  const ico=`<div class="inv-ico"><img src="${INVESTIDOR.ava}" alt="Investidor"></div>`;
  if(etapa===0){modal(`<div class="inv-hero"><img src="${INVESTIDOR.foto}" alt="Investidor"><span>Investidor</span></div><div class="inv-fala"><div><b>Uma ótima notícia!</b><p>A classificação para a ${esc(COPAS[pais().cont].main)} chamou a atenção de um investidor. Ele quer apostar no clube e o plano dele é comprar um estádio novo, maior, para vender mais ingressos e levar muito mais torcida aos jogos.</p></div></div><div class="botoes"><button class="btn prim" data-a="invok">OK</button></div>`);return}
  const i=invIdx,e=ofertaSuper(i),venda=valorEstadioAtual(),c=G.clubs[G.user.club],parte=partePropria(i);
  modal(`<div class="inv-fala">${ico}<div><b>Investidor</b><p>${i===0?"Encontrei 3 superestádios que são ótimas opções para o seu time. Veja só!":i===1?"Esse aqui tem uma das torcidas mais quentes do país:":"E o meu favorito:"}</p></div></div>
    <div class="est-atual"><span>Seu estádio hoje</span><b>${esc(estadioDe(c))}</b><span class="num">${c.cap.toLocaleString("pt-BR")} lugares · vale ${dinheiro(venda)}</span></div>
    <div class="inv-car"><button class="seta" data-a="invant" ${i===0?"disabled":""} aria-label="Anterior">‹</button>${fotoSuper(i)}<button class="seta dir" data-a="invprox" ${i===2?"disabled":""} aria-label="Próximo">›</button></div>

function nomeCurtoCopa(){const n=G.cup.nome;return n==="Champions League"?"Champions":n==="Europa League"?"Europa L.":n==="Sul-Americana"?"Sul-Americana":n}
function rotuloEtapa(){
  if(G.seasonEnd)return "Temporada encerrada";
  if(G.fase==="pre")return "Pré-temporada";
  if(G.fase==="janela")return "Janela de transferências";
  const ev=proximoEvento();if(!ev)return "";
  return ev.k==="L"?`Rodada ${ev.r+1} de ${nRodadas()}`:ev.k==="N"?G.copaN.nome:G.cup.nome;
}

function render(){
  if(G)tocou();
  if(SOM.ctx)somModo(modoDesejado());
  if(abertura)return renderAbertura();
  {const sp=$("#splash");if(!sp.hidden&&!sp.classList.contains("saindo")){sp.classList.add("saindo");somLancamento();vibrar("capa");setTimeout(()=>{sp.classList.remove("saindo");if(!abertura)sp.hidden=true},620)}
   else if(!sp.classList.contains("saindo"))sp.hidden=true}
  app.hidden=false;
  if(!G){nav.hidden=true;if(!W)W=novoW();return renderCriacao()}
  if(G.live&&aba!=="partida")aba="partida";
  if(!G.live&&aba==="partida")aba=G.ultimoJogo&&G.ultimoJogo.pendente?"resultado":"inicio";
  const telaCheia=["visual","partida","resultado","prejogo"].includes(aba);
  nav.hidden=telaCheia;
  nav.innerHTML=`<div class="wrap">${abasNav().map(k=>`<button data-a="aba" data-v="${k}" aria-current="${aba===k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONES[k]}</svg>${k==="copa"?nomeCurtoCopa():ROTULOS[k]}</button>`).join("")}</div>`;
  const c=G.clubs[G.user.club];
  const topo=`<header class="topo"><span class="esc-topo">${escudoDe(c,40)}</span><div class="info"><h1>${esc(c.name)}</h1><div class="sub">${esc(nomeLiga(c.tier))} · ${G.year} · ${rotuloEtapa()}</div></div><div class="caixa num${G.cash<0?" neg":""}"><small>Caixa</small>${dinheiro(G.cash)}</div><button class="som-btn" data-a="som" aria-label="${SOM.mudo?"Ligar som":"Desligar som"}">${iconeSom()}</button></header>`;
  const corpo={inicio:telaInicio,elenco:telaElenco,tabela:telaTabela,mercado:telaMercado,clube:telaClube,escudo:telaEscudo,upgrades:telaUpgrades,copa:telaAbaCopa,jogar:telaJogar,perfil:telaPerfil,financas:telaFinancas,config:telaConfig,visual:telaVisual,prejogo:telaPreJogo,partida:telaPartida,resultado:telaResultado}[aba]();
  app.innerHTML=(telaCheia?"":topo)+corpo;
  if(aba==="partida"){if(G.live&&G.live.est==="rodando")iniciarTimer();else pararTimer();const fd=$("#lv-feed");if(fd)fd.scrollTop=0}
  if(window._relLoja){clearInterval(window._relLoja);window._relLoja=null}
  if(aba==="jogar"&&$("#sim-relogio")){window._relLoja=setInterval(()=>{const el=$("#sim-relogio");if(!el){clearInterval(window._relLoja);return}const ms=(G.simUso&&G.simUso.bloq||0)-Date.now();if(ms<=0){clearInterval(window._relLoja);render();return}el.textContent=fmtRelogio(ms)},1000)}
  if(aba==="mercado"&&$("#loja-relogio")){const k0=G.diario&&G.diario.dia;window._relLoja=setInterval(()=>{const el=$("#loja-relogio");if(!el){clearInterval(window._relLoja);return}el.textContent=fmtRelogio(msParaRenovar());if(cicloLoja()!==k0){clearInterval(window._relLoja);render()}},1000)}
  if(aba==="partida"||aba==="resultado")return;
  if(!G.over&&(G.tut??TUTORIAL.length)<TUTORIAL.length&&aba==="inicio"&&!document.querySelector(".veu"))mostrarTutorial();
  if(G.over)modalFim();
  else if(G.seasonEnd&&!document.querySelector(".veu")&&!G.seasonEnd.visto){G.seasonEnd.visto=true;if(G.seasonEnd.pos<=5&&!G.seasonEnd.podioVisto)celebrarPodio();else modalTemporada()}
  {const ab=document.querySelector('nav [aria-current="true"]');if(ab&&ab.scrollIntoView)ab.scrollIntoView({block:"nearest",inline:"nearest"})}
  if(!telaCheia&&G.investidor&&G.investidor.pend&&!G.seasonEnd&&!document.querySelector(".veu")){G.investidor.pend=false;invIdx=0;salvar();modalInvestidor(0)}
  if(!telaCheia&&G.alertaFolha&&!document.querySelector(".veu")){G.alertaFolha=false;salvar();
    modal(`<h3>Faltou dinheiro para as contas</h3><p>O pagamento da folha deixou o caixa em <b style="color:var(--ruim)">${dinheiro(G.cash)}</b>. Para não acumular dívida, você pode pegar um empréstimo no banco e pagar em parcelas junto com a folha.</p><p class="muted peq">Se o clube fechar a temporada devendo muito, a diretoria intervém e o jogo acaba.</p><div class="botoes"><button class="btn" data-a="fechar">Depois</button><button class="btn prim" data-a="aba" data-v="financas">Ver empréstimos</button></div>`)}
  if(G.perfil&&G.perfil.toastXP){const t=G.perfil.toastXP;G.perfil.toastXP=null;setTimeout(()=>toast(t),1300)}
  if(!G.over)checarPremios();
  if(!telaCheia&&!G.over)avisoNivel();
  if(!G.over)checarCopas();
  if(!telaCheia&&!G.over&&G.celebFila&&G.celebFila.length&&!document.querySelector(".veu")){const c=G.celebFila.shift();celebrar(c)}
  if(!telaCheia&&!G.over)mostrarPremio();
  if(aba==="perfil"){const b=document.querySelector('nav [data-v="perfil"]');if(b)b.classList.remove("brilha")}
}

/* ---------- criação do clube ---------- */
const PASSOS=["Nome","País","Escudo","Uniforme","Estádio"];
function econPaisC(k){const r=PAISES[k].t[2].map(s=>+s.split("|")[1]).filter(isFinite);return econ(Math.round(r.reduce((a,b)=>a+b,0)/r.length))}
function escalaFund(k){return k==="BRA"?1:econPaisC(k)/econPaisC("BRA")}
function caixaFundacao(k){return Math.round(700*escalaFund(k)/10)*10}
function precoEstadioFund(k){return Math.round(650*escalaFund(k)/10)*10}
function dinheiroPais(k,v){const m=PAISES[k].moeda;return v>=1000?`${m} ${(v/1000).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})} mi`:`${m} ${Math.round(v).toLocaleString("pt-BR")} mil`}
function renderCriacao(){
  const p=W.passo;
  const cx0=caixaFundacao(W.pais),cxAgora=W.estComprado?cx0-precoEstadioFund(W.pais):cx0;
  const fundo=p===2&&typeof FUNDO_PAIS!=="undefined"?FUNDO_PAIS:p===3&&typeof FUNDO_ESCUDO!=="undefined"?FUNDO_ESCUDO:typeof FUNDO_CRIACAO!=="undefined"?FUNDO_CRIACAO:"";
  let h=`${fundo?`<div class="fund-bg" style="background-image:url(${fundo})"></div>`:""}<div class="fund p${p}"><div class="caixa-fund num${W.estComprado?" baixou":""}"><small>Caixa</small>${dinheiroPais(W.pais,cxAgora)}</div>`;
  if(p===1)h+=`<div class="marca">Funde seu<br><em>clube</em></div><p>Funde um clube, comece na terceira divisão do seu país e suba até a elite. Lá em cima, dispute a Libertadores ou a Champions League.</p>`;
  h+=`<ol class="passos">${PASSOS.map((n,i)=>`<li aria-current="${i+1===p?"step":"false"}" class="${i+1<p?"feito":""}"><b>${i+1}</b>${n}</li>`).join("")}</ol>`;
  if(p===1){
    h+=`<label class="campo"><span>Nome do time</span><input type="text" id="w-nome" maxlength="28" placeholder="Ex.: Esporte Clube Ventania" value="${esc(W.nome)}"></label>
    <div class="dupla"><label class="campo"><span>Seu nome (dono do clube)</span><input type="text" id="w-tec" maxlength="24" placeholder="Ex.: Carlos" value="${esc(W.tec)}"></label>
    <div class="campo"><span class="rot-info"><label for="w-sigla">Sigla</label><button type="button" class="info-bt" data-a="infosigla" aria-label="Para que serve a sigla">i</button></span><input type="text" id="w-sigla" maxlength="3" placeholder="${esc((W.nome?siglaDe(W.nome):"ECV").slice(0,3))}" value="${esc(W.sigla)}" style="text-transform:uppercase"></div></div>
`;
  }else if(p===2){
    const ks=Object.keys(PAISES);
    h+=`<h2 style="margin-top:0">País do time</h2><p class="muted peq" style="margin:-4px 0 10px">Arraste para o lado para ver os outros países.</p>
    <div class="carrossel" id="carrossel">${ks.map(k=>{const P=PAISES[k];return `<button class="pais-card" data-a="wpais" data-v="${k}" aria-pressed="${W.pais===k}">
      <div class="bandeira">${bandeiraSVG(k)}</div>
      <b class="pais-nome">${P.nome}</b>
      <span class="pais-desc">Começa na <strong>${P.ligas[2]}</strong><br>Sobe para ${P.ligas[1]} e ${P.ligas[0]}<br>Copa continental: ${COPAS[P.cont].main}</span>
      <span class="pais-ok">${W.pais===k?"Selecionado":"Toque para escolher"}</span></button>`}).join("")}</div>
    <div class="pontos-car">${ks.map(k=>`<i class="${W.pais===k?"on":""}" data-k="${k}"></i>`).join("")}</div>`;
  }else if(p===3){
    h+=editorEscudo(W.escudo,W.nome.trim()||"Seu Clube");
  }else if(p===4){
    h+=editorUniforme(W.unis,W.escudo);
  }else{
    const nomeE=(W.estadio||"").trim()||`Arena ${W.nome.trim()||"do Clube"}`;
    if(!W.estComprado){
      h+=`<h2 style="margin-top:0">Estádio</h2><div class="oferta-est"><b style="font-size:17px">O ${esc(W.nome.trim()||"seu clube")} ainda não tem estádio.</b>
      <p style="margin:6px 0 12px">Temos uma oferta para você! Um estádio municipal está à venda por <b>${dinheiroPais(W.pais,precoEstadioFund(W.pais))}</b>. Você tem ${dinheiroPais(W.pais,caixaFundacao(W.pais))} em caixa, então ainda sobra um dinheirinho.</p>
      <div class="est-venda"><span class="placa-venda">À VENDA</span>${fotoEstadio(0,"Estádio à venda",ESTADIO_INICIAL)}</div>
      <label class="campo" style="margin-top:12px"><span>Nome do seu estádio</span><input type="text" id="w-estadio" maxlength="30" placeholder="Arena ${esc(W.nome.trim()||"do Clube")}" value="${esc(W.estadio||"")}"></label>
      <button class="btn prim full" data-a="compraest">Comprar estádio · ${dinheiroPais(W.pais,precoEstadioFund(W.pais))}</button></div>`;
    }else{
      h+=`<h2 style="margin-top:0">Parabéns, o estádio é seu!</h2><div class="est-comprado">${fotoEstadio(0,nomeE,ESTADIO_INICIAL)}</div>
      <p class="muted peq">Pago ${dinheiroPais(W.pais,precoEstadioFund(W.pais))}. Sobraram ${dinheiroPais(W.pais,caixaFundacao(W.pais)-precoEstadioFund(W.pais))} no caixa. Começa com ${ESTADIO_INICIAL.toLocaleString("pt-BR")} lugares. Cada reforma na aba Upgrades deixa o estádio maior e mais bonito: 2 reformas na ${esc(PAISES[W.pais].ligas[2])}, mais 3 na ${esc(PAISES[W.pais].ligas[1])} e as 3 últimas na ${esc(PAISES[W.pais].ligas[0])}, até a inauguração da arena coberta.</p>`;
    }
  }
  h+=`<div class="linha" style="gap:10px">${p>1?`<button class="btn" data-a="wvoltar" style="flex:1">Voltar</button>`:""}${p<5||W.estComprado?`<button class="btn prim" data-a="wseguir" style="flex:2">${p<5?"Continuar":"Fundar clube"}</button>`:""}</div>`;
  if(p===2)h+=`<p class="peq muted">Os clubes adversários são os reais de 2026/27. Elencos e nomes de jogadores são gerados pelo jogo. Na Argentina, as divisões foram reorganizadas em três ligas de 20 clubes.</p>`;
  h+=`</div>`;
  app.innerHTML=h;
  if(p===2)ligarCarrossel();
}

function bandeiraSVG(k){
  const v='viewBox="0 0 300 200" width="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"';
  if(k==="BRA")return `<svg ${v}><rect width="300" height="200" fill="#009c3b"/><path d="M150 22L276 100L150 178L24 100Z" fill="#ffdf00"/><circle cx="150" cy="100" r="44" fill="#002776"/><path d="M107 92Q150 78 193 106L192 115Q150 88 108 101Z" fill="#fff"/>${[[130,120],[145,128],[160,122],[170,112],[138,108],[152,138],[124,132]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.8" fill="#fff"/>`).join("")}</svg>`;
  if(k==="ARG")return `<svg ${v}><rect width="300" height="200" fill="#74acdf"/><rect y="66.7" width="300" height="66.7" fill="#fff"/><circle cx="150" cy="100" r="15" fill="#f6b40e"/>${Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;return `<path d="M${150+17*Math.cos(a-.12)} ${100+17*Math.sin(a-.12)}L${150+27*Math.cos(a)} ${100+27*Math.sin(a)}L${150+17*Math.cos(a+.12)} ${100+17*Math.sin(a+.12)}Z" fill="#f6b40e"/>`}).join("")}<circle cx="150" cy="100" r="15" fill="none" stroke="#85340a" stroke-width="1.2"/></svg>`;
  if(k==="ENG")return `<svg ${v}><rect width="300" height="200" fill="#fff"/><rect x="130" width="40" height="200" fill="#ce1124"/><rect y="80" width="300" height="40" fill="#ce1124"/></svg>`;
  if(k==="ESP")return `<svg ${v}><rect width="300" height="200" fill="#aa151b"/><rect y="50" width="300" height="100" fill="#f1bf00"/></svg>`;
  if(k==="GER")return `<svg ${v}><rect width="300" height="67" fill="#000"/><rect y="66.7" width="300" height="67" fill="#dd0000"/><rect y="133.3" width="300" height="66.7" fill="#ffce00"/></svg>`;
  if(k==="FRA")return `<svg ${v}><rect width="100" height="200" fill="#002395"/><rect x="100" width="100" height="200" fill="#fff"/><rect x="200" width="100" height="200" fill="#ed2939"/></svg>`;
  return "";
}
function ligarCarrossel(){
  const car=$("#carrossel");if(!car||car.dataset.ok)return;car.dataset.ok="1";
  const cards=[...car.querySelectorAll(".pais-card")];
  const alvo=cards.find(c=>c.dataset.v===W.pais);if(alvo)car.scrollLeft=alvo.offsetLeft-(car.clientWidth-alvo.clientWidth)/2;
  let t;car.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{
    const meio=car.scrollLeft+car.clientWidth/2;let best=cards[0],bd=1e9;
    cards.forEach(c=>{const d=Math.abs(c.offsetLeft+c.clientWidth/2-meio);if(d<bd){bd=d;best=c}});
    selecionarPais(best.dataset.v);
  },110)},{passive:true});
}
function selecionarPais(k){
  W.pais=k;
  document.querySelectorAll(".pais-card").forEach(c=>{const on=c.dataset.v===k;c.setAttribute("aria-pressed",on);c.querySelector(".pais-ok").textContent=on?"Selecionado":"Toque para escolher"});
  document.querySelectorAll(".pontos-car i").forEach(i=>i.classList.toggle("on",i.dataset.k===k));
}

const chipCor=(k,cor,txt)=>`<label class="chip-cor"><input type="color" data-cor="escudo" data-k="${k}" value="${cor}"><i class="roda-cor" aria-hidden="true"></i><em style="background:${cor}"></em>${txt}</label>`;
/* barrinha 0 a 100 (50 = meio, puxa pro 50 quando chega perto); guarda no escudo o valor real entre min e max */
const barraEsc=(k,tit,min,max,v,a,b)=>{const p=Math.round((v-min)/(max-min)*100);return `<label class="campo barra-esc"><span>${tit} <b class="barra-num">${p}</b></span><input type="range" data-escr="${k}" data-min="${min}" data-max="${max}" min="0" max="100" step="1" value="${p}"><span class="barra-rot"><small>${a}</small><small>50</small><small>${b}</small></span></label>`};
/* formato, desenho e símbolo ficam fechados; toca no título pra abrir a grade, Salvar (ou o título) fecha */
let escAberto=null;
function secEsc(k,tit,atual,grade,ck,cor,extra){const ab=escAberto===k;
  return `<div class="campo esc-sec${ab?" aberto":""}"><button type="button" class="esc-cab" data-a="escsec" data-v="${ab?"":k}"><span>${tit}</span><small>${esc(atual)}</small><b aria-hidden="true">${ab?"▲":"▼"}</b></button>${ab?grade+`<button type="button" class="btn prim full" data-a="escsec" data-v="">Salvar</button>`:""}
  ${ck||extra?`<div class="esc-cor"><span>Cores · personalizar</span><span class="chips">${ck?chipCor(ck,cor,"Escolher cor"):""}${extra||""}</span></div>`:""}</div>`}
function editorEscudo(e,nome){if(e.nomeOn===undefined)e.nomeOn=false;
  return `<h2 style="margin-top:0">Escudo</h2>
  <div class="previa" id="prev-escudo">${escudoSVG(e,"",120,nome)}</div>
  ${secEsc("forma","Formato",FORMAS[e.forma%FORMAS.length][0],`<div class="grade8">${FORMAS.map((f,i)=>`<button data-a="eforma" data-v="${i}" aria-pressed="${e.forma===i}" aria-label="${f[0]}">${escudoSVG({...e,forma:i,simbolo:0},"",34)}<small>${f[0]}</small></button>`).join("")}</div>${barraEsc("bordaEsp","Grossura da borda do escudo",.1,1,e.bordaEsp??1,"Bem fina","Grossa")}`,"c1",e.c1,chipCor("c3",e.c3,"Borda"))}
  ${secEsc("estampa","Desenho",ESTAMPAS[e.estampa%ESTAMPAS.length],`<div class="grade8">${ESTAMPAS.map((n,i)=>`<button data-a="eestampa" data-v="${i}" aria-pressed="${e.estampa===i}">${escudoSVG({...e,estampa:i,simbolo:0},"",30)}<small>${n}</small></button>`).join("")}</div>`,"c2",e.c2)}
  ${secEsc("simbolo","Símbolo",SIMBOLOS[e.simbolo||0],`<div class="grade8">${SIMBOLOS.map((s,i)=>`<button data-a="esimbolo" data-v="${i}" aria-pressed="${(e.simbolo||0)===i}">${escudoSVG({...e,simbolo:i,sigla:false},"",30)}<small>${s}</small></button>`).join("")}</div>${e.simbolo?`<div class="nome-esc" style="margin-top:6px"><div class="previa-mini" id="prev-escudo-sim">${escudoSVG(e,"",96,nome)}</div><div class="campo"><span>Cor do símbolo</span><div class="seg" role="group">${[["orig","Cor original"],["time","Personalizada"]].map(([k,n])=>`<button data-a="esimcor" data-v="${k}" aria-pressed="${(e.simCor==="time")===(k==="time")}">${n}</button>`).join("")}</div>${e.simCor==="time"?`<div class="linha-chip">${chipCor("c4",e.c4||e.c3,"Escolher cor")}</div>`:""}</div>
  <div class="campo"><span>Borda do símbolo</span><div class="seg" role="group">${[["0","Sem borda"],["1","Com borda"]].map(([k,n])=>`<button data-a="esimborda" data-v="${k}" aria-pressed="${(e.simBorda===true)===(k==="1")}">${n}</button>`).join("")}</div>${e.simBorda?`<div class="linha-chip">${chipCor("simBordaCor",e.simBordaCor||"#ffffff","Cor da borda")}</div>${barraEsc("simBordaEsp","Grossura da borda",.1,1,e.simBordaEsp??1,"Bem fina","Grossa")}`:""}</div>
  ${barraEsc("simTam","Tamanho",.4,1.6,e.simTam??1,"Menor","Maior")}
  ${barraEsc("simY","Altura",-40,40,e.simY||0,"Em cima","Embaixo")}
  ${barraEsc("simX","Lados",-30,30,e.simX||0,"Esquerda","Direita")}</div>`:""}`,"c4",e.c4||e.c3)}
  ${secEsc("nome","Nome no escudo",e.nomeOn?(e.nomeTxt||nome):"Escondido",`  <div class="campo"><span>Mostrar no escudo</span><div class="seg" role="group">${[["1","Mostrar"],["0","Esconder"]].map(([k,n])=>`<button data-a="enome" data-v="${k}" aria-pressed="${!!e.nomeOn===(k==="1")}">${n}</button>`).join("")}</div></div>
  ${e.nomeOn?`<div class="nome-esc"><div class="previa-mini" id="prev-escudo-nome">${escudoSVG(e,"",96,nome)}</div>
  <label class="campo"><span>Texto no escudo</span><input type="text" id="esc-txt" maxlength="28" value="${esc(e.nomeTxt??nome)}" placeholder="${esc(nome)}"><small class="peq muted">Pode ser o nome, uma sigla ou o que quiser. Só muda o escudo.</small></label>
  <div class="campo"><span>Fonte</span><div class="seg fontes-esc" role="group">${FONTES_ESC.map(([n,f,w,up],i)=>`<button data-a="efonte" data-v="${i}" aria-pressed="${(e.fonte||0)===i}" style="font-family:${f};font-weight:${w};font-size:17px${up?";text-transform:uppercase":""}">${n}</button>`).join("")}</div></div>
  <div class="campo"><span>Tamanho</span><div class="seg" role="group"><button data-a="etam" data-v="-1" ${(e.tam||1)<=.5?"disabled":""}>Diminuir −</button><button aria-pressed="true" style="pointer-events:none">${Math.round((e.tam||1)*100)}%</button><button data-a="etam" data-v="1" ${(e.tam||1)>=1.8?"disabled":""}>Aumentar +</button></div></div>
  ${barraEsc("arco","Arco do nome",-80,80,e.arco??({1:62,"-1":-50}[e.curva]||0),"Para baixo","Para cima")}
  ${barraEsc("nomeY","Altura",10,115,e.nomeY??({1:62,"-1":74}[e.curva]||(TEXTO_Y[e.forma%FORMAS.length]||70)+2),"Em cima","Embaixo")}

const SIM_CUSTO=[10,30,60,100];

function pagarSimulacao(){
  const S=simEstado(),c=simCusto();if(!c)return "A simulação está em recarga.";

    <button class="btn perigo" data-a="novacarreira">Nova carreira</button><input type="file" id="arq-save2" accept=".json,application/json,text/plain" hidden></div>`;

  ${(()=>{const fim=jogadoresDo(uid).filter(p=>(p.ct??2)<=1);return fim.length?`<p class="peq" style="margin:12px 0 0;color:var(--aviso)"><b>Contratos terminando:</b> ${fim.map(p=>esc(p.n)).join(", ")}. Eles saem quando a próxima temporada começar. Renove no Elenco antes de avançar.</p>`:""})()}

/* ---------- ações ---------- */
function guardarW(){const n=$("#w-nome"),t=$("#w-tec"),s=$("#w-sigla"),es=$("#w-estadio");if(es)W.estadio=es.value;if(n)W.nome=n.value;if(t)W.tec=t.value;if(s)W.sigla=s.value.toUpperCase().slice(0,3)}
function acao(a,v,el){
  const vis=()=>alvoVisual();
  switch(a){
    case "aba":aba=v;expandido=null;if(v==="inicio"&&el&&nav.contains(el))abertura=true; // Início na barra de baixo volta pra capa
if(v!=="tabela"){}window.scrollTo(0,0);break;
    case "wseguir":{
      guardarW();
      if(W.passo===1&&W.nome.trim().length<3){toastErro("Dê ao time um nome com pelo menos 3 letras.");return}
      if(W.passo===1&&W.tec.trim().length<2){toastErro("Preencha o seu nome (dono do clube).");return}
      if(W.passo===1&&!/^[A-Z0-9]{3}$/.test(W.sigla.trim())){toastErro("A sigla precisa ter 3 letras.");return}
      if(W.passo<5){W.passo++;window.scrollTo(0,0);break}
      const sig=(W.sigla||siglaDe(W.nome)).trim().toUpperCase().slice(0,3);
      novoJogo({pais:W.pais,name:W.nome.trim(),short:sig,coach:W.tec.trim()||"Professor",escudo:{...W.escudo},unis:W.unis.map(x=>({...x}))});uniSel=0;
      {const c=G.clubs[G.user.club];c.estadio=(W.estadio||"").trim()||`Arena ${c.name}`;c.cap=ESTADIO_INICIAL;G.reformas=0;G.cash=caixaFundacao(W.pais)-precoEstadioFund(W.pais);}
      aba="inicio";W=null;salvar();window.scrollTo(0,0);break;}
    case "wvoltar":guardarW();W.passo--;window.scrollTo(0,0);break;
    case "compraest":guardarW();W.estComprado=true;window.scrollTo(0,0);setTimeout(confete,60);break;
    case "wpais":{selecionarPais(v);const c=el;const car=$("#carrossel");if(car&&c)car.scrollTo({left:c.offsetLeft-(car.clientWidth-c.clientWidth)/2,behavior:"smooth"});return;}
    case "eforma":vis().e.forma=+v;if(G)salvar();break;
    case "eestampa":vis().e.estampa=+v;if(G)salvar();break;
    case "esimbolo":vis().e.simbolo=+v;if(G)salvar();break;
    case "esimcor":vis().e.simCor=v;if(G)salvar();break;
    case "infosigla":modal(`<h3>Sigla do clube</h3><p>São 3 letras que representam o seu time, como <b>FLA</b> ou <b>COR</b>.</p><p>Ela aparece:</p><ul class="lista-info"><li>No <b>placar</b> e na narração das partidas ao vivo (ex.: <b>${esc((W&&W.sigla)||"ECV")} 2 × 1 SAN</b>)</li><li>No <b>confronto do pré-jogo</b>, embaixo do escudo</li><li>No <b>escudo</b>, se você escolher mostrar</li><li>Na <b>escalação</b> do campinho</li></ul><p class="muted peq">Dá para mudar depois na aba Clube.</p><div class="botoes"><button class="btn prim" data-a="fechar">Entendi</button></div>`);return;
    case "escsec":{if(G)salvar();const alvo=v||escAberto;escAberto=v||null;render();const b=[...document.querySelectorAll(".esc-cab")].find(x=>x.dataset.v===alvo||(x.dataset.v===""&&escAberto===alvo));if(b)b.scrollIntoView({block:"center"});return;}
    case "escsalvar":if(G)salvar();toast("Escudo salvo!");return;
    case "esimborda":vis().e.simBorda=v==="1";if(G)salvar();break;
    case "enomeborda":vis().e.nomeBorda=v==="1";if(G)salvar();break;
    case "enome":vis().e.nomeOn=v==="1";escAberto="nome";if(G)salvar();break;
    case "ecurva":vis().e.curva=+v;if(G)salvar();break;
    case "efonte":vis().e.fonte=+v;if(G)salvar();break;
    case "etam":{const e=vis().e;e.tam=Math.round(Math.min(1.8,Math.max(.5,(e.tam||1)+.1*v))*10)/10;if(G)salvar();break;}
    case "unisel":uniSel=+v;break;
    case "uinverter":{const {unis}=vis();unis[uniSel]=inverterUni(unis[1-uniSel]);if(G)salvar();break;}
    case "uestilo":aplicarModeloUni(vis().u,v);if(G)salvar();break;
    case "umeiao":vis().u.meiaoEst=v;if(G)salvar();break;
    case "ucores":{const {e,u}=vis();if(uniSel===0)Object.assign(u,{camisa:e.c1,detalhe:e.c2,d2:e.c3});else Object.assign(u,{camisa:e.c2,detalhe:e.c1,d2:e.c3});aplicarModeloUni(u,u.estilo);if(G)salvar();break;}
    case "patro":{const er=escolherPatrocinio(+v);if(er)toastErro(er);salvar();break;}
    case "fecharjanela":{const er=fecharJanela();if(er){toastErro(er);return}salvar();toast(G.ev===0?"Bola rolando! Boa temporada.":"Janela fechada.");window.scrollTo(0,0);break;}
    case "iniciarjogo":{const er=iniciarAoVivo(false);if(er){toastErro(er);return}somIniciar();setTimeout(()=>apito(.9),250);painel=null;liveSel=null;aba="partida";salvar();window.scrollTo(0,0);break;}
    case "simularjogo":{if(!partidaAtual()){toastErro("Não há partida agora.");return}const ep=pagarSimulacao();if(ep){toastErro(ep);return}const er=iniciarAoVivo(true);if(er){toastErro(er);return}simularRestante();concluirAoVivo();G.ultimoJogo.pendente=true;aba="resultado";salvar();window.scrollTo(0,0);somIniciar();setTimeout(somResultado,300);break;}
    case "lvpausa":{if(G.live.est==="rodando"){G.live.est="pausa";G.live.motivo=null}painel=v;liveSel=null;pararTimer();salvar();break;}
    case "lvpainel":painel=painel===v?null:v;liveSel=null;break;
    case "lvretomar":{const V=G.live;V.ultSub=null;const L=V.L[V.lado];
      if(V.motivo==="goleiro"&&!L.xi[FORMACOES[L.form].s.indexOf("GOL")]&&L.subs<MAX_SUBS&&bancoDe(V.lado).some(p=>p.pos==="GOL")){toastErro("Coloque um goleiro antes de continuar.");return}
      {const eraIntervalo=V.est==="intervalo";retomarAoVivo();if(eraIntervalo&&G.live.est==="rodando")apito(.8);}painel=null;liveSel=null;salvar();break;}
    case "lvsai":liveSel=+v;break;

      if(V.motivo==="goleiro"){const sl=FORMACOES[V.L[V.lado].form].s,gi=sl.indexOf("GOL");const L=V.L[V.lado];
        if(L.xi[gi]==null&&L.bloq[gi]&&liveSel!==gi){L.bloq[gi]=false;L.bloq[liveSel]=true;const out=L.xi[liveSel];if(out!=null)L.part[out].fim=V.min;L.xi[liveSel]=null;const er=substituir(V.lado,gi,+v);if(er){toastErro(er);return}V.motivo=null;liveSel=null;salvar();break}}
      const L=V.L[V.lado],sai=L.xi[liveSel];const er=substituir(V.lado,liveSel,+v);if(er){toastErro(er);return}V.ultSub=`Saiu ${sai!=null?G.players[sai].n:"vaga aberta"}, entrou ${G.players[+v].n}.`;if(V.motivo==="lesao")V.motivo=null;liveSel=null;salvar();break;}
    case "lvcmd":G.live.cmd=v;toast(v==="tec"?"Comando do técnico: ele faz as trocas.":"Comando manual: as trocas são suas.");salvar();break;
    case "lvmelhor":{const V=G.live;if(V.L[V.lado].subs>=MAX_SUBS){toastErro("Já foram feitas as 5 substituições.");return}const n=melhorarTime(V.lado);toast(n?`${n} troca${n>1?"s":""} feita${n>1?"s":""}.`:"O time em campo já é o melhor possível.");if(n)V.ultSub=null;salvar();break;}
    case "lvform":trocarFormacao(G.live.lado,v,null);salvar();break;
    case "lvest":trocarFormacao(G.live.lado,null,v);salvar();break;
    case "lvvel":velocidade=velocidade>1?1:3;if(G.live&&G.live.est==="rodando")iniciarTimer();break;
    case "lvconcluir":{pararTimer();concluirAoVivo();if(G.ultimoJogo)G.ultimoJogo.pendente=true;aba="resultado";salvar();window.scrollTo(0,0);setTimeout(somResultado,300);break;}
    case "resok":if(G.ultimoJogo)G.ultimoJogo.pendente=false;aba="inicio";salvar();window.scrollTo(0,0);break;
    case "vertemporada":modalTemporada();return;
    case "proxima":fecharModal();proximaTemporada();salvar();aba="inicio";divTab=null;tabModo="tab";window.scrollTo(0,0);break;
    case "negociar":{const er=listarParaNegocio(+v);if(er)toastErro(er);else{const p=G.players[+v];toast(p.ofertas.length?`${p.ofertas.length} proposta${p.ofertas.length>1?"s":""} por ${p.n}. Veja no Início.`:`Nenhum clube fez proposta por ${p.n} ainda.`)}salvar();break;}

    case "escolher":{const i=+v,pid=+el.dataset.p,u=G.user;const j=u.lineup.indexOf(pid);if(j>=0)u.lineup[j]=u.lineup[i];u.lineup[i]=pid;fecharModal();salvar();break;}
