<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FUT Master</title><link rel="manifest" href="app/manifest.json"><link rel="apple-touch-icon" href="app/icon-180.png"><link rel="icon" href="app/icon-192.png"><meta name="theme-color" content="#0a1430"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FUT Master"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&family=Permanent+Marker&family=Archivo:wght@400;500;600;700;800&family=Bebas+Neue&family=Graduate&family=Russo+One&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}img{max-width:100%}

/* Layout: app de uma coluna, cabeçalho de placar no topo e navegação fixa embaixo, em azul-escuro de estádio à noite */
:root{
  --gramado:#0a1430;      /* fundo: azul-escuro */
  --gramado-2:#111f45;    /* superfícies */
  --gramado-3:#1d3166;    /* bordas e linhas */
  --cal:#eef2fb;          /* texto principal */
  --cal-2:#9eafd2;        /* texto secundário */
  --canario:#ffd23f;      /* destaque */
  --canario-ink:#1a1400;
  --ok:#5fd38d; --ruim:#ff6b5b; --aviso:#ffb347; --azul:#6cb6ff;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--gramado);color:var(--cal);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 96px;min-height:100%}
.fundo-jogar{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.fundo-jogar video{width:100%;height:100%;object-fit:cover}
.fundo-jogar i{position:absolute;inset:0;background:rgba(8,20,52,.8)}
.prox-centro{margin-top:8px}
.prox-centro h2{font-size:clamp(26px,8vw,36px);letter-spacing:.06em;color:#c9d4f2;margin:44px 0 8px}
.prox-centro .pm-times b{font-size:clamp(16px,5vw,22px)}
.prox-centro .prox-mini p{font-size:14px}
.prox-centro .prox-mini{border:2px solid var(--canario);border-radius:18px;animation:proxBrilho 2.4s ease-in-out infinite}
@keyframes proxBrilho{0%,100%{box-shadow:0 0 10px rgba(255,210,63,.35),inset 0 0 8px rgba(255,210,63,.12)}50%{box-shadow:0 0 26px rgba(255,210,63,.75),inset 0 0 14px rgba(255,210,63,.25)}}

/* cabeçalho placar */
.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--gramado);padding-block:20px 10px;border-bottom:1px solid var(--gramado-3);display:flex;align-items:center;gap:12px}
.topo-data{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:10.5px;letter-spacing:.05em;color:var(--cal-2);pointer-events:none;text-transform:uppercase}
.escudo{width:42px;height:42px;flex:0 0 42px;border-radius:10px 10px 21px 21px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.04em;border:2px solid rgba(255,255,255,.25)}
.escudo.p{width:28px;height:28px;flex-basis:28px;font-size:11px;border-width:1.5px;border-radius:7px 7px 14px 14px}
.topo .info{min-width:0;flex:1}
.topo h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo .sub{color:var(--cal-2);font-size:12.5px;letter-spacing:.03em}
.caixa{text-align:right;font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.1}
.caixa small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--cal-2);letter-spacing:.06em;text-transform:uppercase}
.neg{color:var(--ruim)}

/* nav */
nav.abas{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--gramado-2);border-top:1px solid var(--gramado-3);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.abas{transition:transform .25s ease}nav.abas.some{transform:translateY(115%)}
nav.abas .wrap{display:flex;width:100%;max-width:720px}
nav.abas button{flex:1;background:none;border:0;padding:8px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--cal-2);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.abas button svg{width:22px;height:22px}
nav.abas .wrap{gap:0;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity}nav.abas .wrap::-webkit-scrollbar{display:none}nav.abas .wrap button{flex:0 0 auto;min-width:58px;font-size:10.5px;padding-inline:4px;letter-spacing:-.01em;scroll-snap-align:start}
nav.abas button[aria-current="true"]{color:var(--canario)}
nav.abas button[data-v="jogar"] svg{width:26px;height:26px;color:var(--canario)}
nav.abas button[data-v="jogar"]{color:var(--cal)}
nav.abas button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--canario);outline-offset:2px}

h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--cal-2);margin:24px 0 10px}
.secao{display:flex;flex-direction:column;gap:10px}
.cartao{background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:14px;padding:14px}
.linha{display:flex;align-items:center;gap:10px}
.muted{color:var(--cal-2)}
.peq{font-size:12.5px}

.btn{background:var(--gramado-3);border:1px solid transparent;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--cal-2)}
.btn.prim{background:var(--canario);color:var(--canario-ink);font-family:var(--f-display);font-size:19px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.btn.prim:not(:disabled),.btn.prim-mini:not(:disabled){position:relative;overflow:hidden;isolation:isolate}
@media (prefers-reduced-motion:no-preference){
 .btn.prim:not(:disabled){animation:btnBrilho 1.8s ease-in-out infinite,btnVibra 4s ease-in-out infinite}
 .btn.prim:not(:disabled)::after,.btn.prim-mini:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:btnReflexo 2.6s ease-in-out infinite;pointer-events:none;z-index:1}
 .btn.prim-mini:not(:disabled){animation:btnBrilho 1.8s ease-in-out infinite}
 nav.abas button[data-v="jogar"] svg{animation:jogarPulsa 1.6s ease-in-out infinite}
 @keyframes btnBrilho{0%,100%{box-shadow:0 0 0 0 rgba(255,210,63,.55),0 4px 14px rgba(255,210,63,.25)}50%{box-shadow:0 0 0 6px rgba(255,210,63,0),0 6px 26px rgba(255,210,63,.6)}}
 @keyframes btnVibra{0%,86%,100%{transform:none}88%{transform:rotate(-1.2deg) scale(1.02)}90%{transform:rotate(1.2deg) scale(1.02)}92%{transform:rotate(-1deg)}94%{transform:rotate(.8deg)}96%{transform:none}}
 @keyframes btnReflexo{0%{left:-60%}55%,100%{left:130%}}
 @keyframes jogarPulsa{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 rgba(255,210,63,0))}50%{transform:scale(1.15);filter:drop-shadow(0 0 6px rgba(255,210,63,.9))}}
}
.btn.prim:not(:disabled):active{transform:scale(.97)}
.btn.prim:hover{filter:brightness(1.06);border-color:transparent}
.btn.mini{min-height:34px;padding:6px 10px;font-size:13px}
.btn.perigo{color:var(--ruim)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.full{width:100%}

/* próximo jogo */
.confronto{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.confronto .time{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.confronto .time b{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.placar{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;letter-spacing:.02em}
.placar .x{color:var(--cal-2);font-size:24px;margin-inline:6px}
.gols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:13px;color:var(--cal-2)}
.gols div:last-child{text-align:right}

.res{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--gramado-3);font-size:14px;align-items:center}
.res:last-child{border-bottom:0}
.res .c{font-family:var(--f-display);font-weight:700;font-size:16px;min-width:56px;text-align:center}
.res span:last-child{text-align:right}
.res.meu{color:var(--canario)}

/* tabela */
.seg{display:flex;background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--cal-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gramado-3);color:var(--cal)}
.rolar{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cal-2);font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid var(--gramado-3)}
td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--gramado-3);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
td.pos{text-align:center;width:30px;font-family:var(--f-display);font-weight:700;font-size:15px}
td.pts{font-weight:700}
tr.meu td{color:var(--canario)}
.z-sobe td.pos{box-shadow:inset 3px 0 0 var(--ok)}
.z-cai td.pos{box-shadow:inset 3px 0 0 var(--ruim)}
.legenda{display:flex;gap:14px;font-size:12px;color:var(--cal-2);flex-wrap:wrap}
.legenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* elenco */
.jog{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--gramado-3)}
.jog:last-child{border-bottom:0}
.posb{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.05em;text-align:center;border-radius:6px;padding:3px 0;background:var(--gramado-3)}
.posb.GOL{background:#5b4a12;color:#ffe08a}.posb.LAT,.posb.ZAG{background:#14405e;color:#a8dcff}
.posb.VOL,.posb.MEI{background:#1f5a33;color:#b9f5cc}.posb.ATA{background:#5e1f1a;color:#ffb8ad}
.jog .nm{min-width:0}
.jog .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jog .nm span{font-size:12px;color:var(--cal-2)}
.ov{font-family:var(--f-display);font-weight:800;font-size:18px;width:44px;height:44px;flex:0 0 44px;border-radius:50%;display:grid;place-items:center;text-align:center;justify-self:end;background:radial-gradient(circle at 35% 30%,#3d63c9,#1b3684);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.35);position:relative}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;margin-left:4px;vertical-align:1px}
.tag.les{background:rgba(255,107,91,.18);color:var(--ruim)}
.tag.venda{background:rgba(255,210,63,.16);color:var(--canario)}
.jog.slot.sel{outline:2.5px solid var(--canario);outline-offset:-2px;border-radius:10px;background:rgba(245,197,24,.08)}
.slot{cursor:pointer;background:none;border:0;border-bottom:1px solid var(--gramado-3);width:100%;text-align:left;color:inherit}
.slot:hover .nm b{color:var(--canario)}
.acoes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.expand{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}

.campo-sel{display:flex;gap:8px;flex-wrap:wrap}
.campo-sel label{flex:1;min-width:140px;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--cal-2);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
select,input[type=text],input[type=number],textarea{background:var(--gramado);border:1px solid var(--gramado-3);border-radius:10px;padding:10px;min-height:42px;width:100%;color:var(--cal)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:11px;min-height:120px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--canario)}

/* forças */
.forca{display:grid;grid-template-columns:70px 1fr 34px;gap:8px;align-items:center;font-size:12.5px;color:var(--cal-2)}
.barra{height:8px;border-radius:4px;background:var(--gramado);overflow:hidden}
.barra i{display:block;height:100%;background:var(--canario)}

/* caixa de entrada */
.msg{border-left:3px solid var(--gramado-3);padding:4px 0 4px 10px;font-size:14px}
.msg.oferta{border-left-color:var(--canario)}
.msg.ruim{border-left-color:var(--ruim)}
.msg.bom{border-left-color:var(--ok)}

/* fundação */
.fund{padding-block:28px 40px;display:flex;flex-direction:column;gap:18px}
.fund .marca{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,13vw,76px);line-height:.9;letter-spacing:-.01em;text-transform:uppercase;text-wrap:balance}
.fund .marca em{font-style:normal;color:var(--canario)}
.fund p{margin:0;max-width:52ch;color:var(--cal-2);font-size:18px}
.fund .campo>span{font-size:15px}.fund input[type=text]{font-size:19px;min-height:54px}
.fund .passos{grid-template-columns:repeat(5,1fr)}.fund .passos li{font-size:15px}.fund .passos li b{font-size:20px}
.fund-bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
.fund{z-index:1}
.rot-info{display:flex;align-items:center;gap:8px}.rot-info label{cursor:pointer}
.info-bt{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--canario);color:var(--canario);font:italic 800 13px/22px Georgia,serif;text-align:center;text-transform:none;letter-spacing:0}
.fontes-esc{flex-wrap:wrap}.fontes-esc button{flex:1 1 30%}
.lista-info{margin:6px 0 10px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cores{display:flex;gap:8px;flex-wrap:wrap}
.cores button{width:36px;height:36px;border-radius:50%;border:2px solid var(--gramado-3);cursor:pointer}
.cores button[aria-pressed="true"]{border-color:var(--canario);box-shadow:0 0 0 3px var(--gramado),0 0 0 5px var(--canario)}
.opcoes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opcoes button{background:var(--gramado-2);border:1.5px solid var(--gramado-3);border-radius:12px;padding:12px 8px;cursor:pointer;text-align:left}
.opcoes button b{display:block;font-family:var(--f-display);font-size:20px}
.opcoes button span{font-size:12px;color:var(--cal-2)}
.opcoes button[aria-pressed="true"]{border-color:var(--canario)}
.campo{display:flex;flex-direction:column;gap:6px}
.campo>span{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cal-2)}
.dupla{display:grid;grid-template-columns:2fr 1fr;gap:10px}

/* modal */
.veu{position:fixed;inset:0;z-index:60;background:rgba(3,8,22,.75);display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--gramado-2);border:1px solid var(--gramado-3);border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:86%;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.folha h3{margin:0 0 6px;font-family:var(--f-display);font-size:24px;font-weight:700}
.folha .botoes{display:flex;gap:8px;margin-top:16px}
.folha .botoes .btn{flex:1}
@media (min-width:700px){.veu{align-items:center}.folha{border-radius:18px}}
.trad-veu{align-items:center;padding:16px}
.trad-box{width:100%;max-width:360px;background:linear-gradient(180deg,var(--gramado-2),var(--gramado-3));border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:14px 0 12px;box-shadow:0 18px 50px rgba(0,0,0,.55);animation:tradEntra .35s ease-out}
@keyframes tradEntra{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.trad-nome{font-family:var(--f-display);font-size:18px;text-align:center;margin-bottom:6px}.trad-nome small{font-family:inherit;font-size:12px;opacity:.65;font-weight:400}
.trad-cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.trad-cards::-webkit-scrollbar{display:none}
.trad-card{flex:0 0 100%;scroll-snap-align:center;padding:0 16px;display:flex;flex-direction:column;align-items:center;box-sizing:border-box}
.trad-foto{height:190px;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.trad-bal{position:relative;background:#fff;color:#14203a;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin-top:-6px;width:100%;box-sizing:border-box}
.trad-bal:before{content:"";position:absolute;top:-8px;left:50%;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.trad-bal p{margin:0 0 8px}.trad-bal p:last-child{margin:0}.trad-ola{display:block;font-size:17px;margin-bottom:6px;color:#0b5d2a}
.trad-seta{margin-top:10px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ouro,#f5c518);color:#14203a;font-size:28px;line-height:1;font-weight:700;cursor:pointer;animation:tradPulsa 1.4s ease-in-out infinite}
@keyframes tradPulsa{50%{transform:translateX(5px)}}
.trad-card .botoes{width:100%;margin-top:10px;display:flex;gap:8px}.trad-card .botoes .btn{flex:1}
.trad-pontos{display:flex;justify-content:center;gap:6px;margin-top:10px}.trad-pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3)}.trad-pontos i.on{background:#fff}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--cal-2);font-weight:600}
.kpi b{font-family:var(--f-display);font-size:24px;font-weight:700}
.extrato div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--gramado-3);font-size:14px}
.extrato div:last-child{border-bottom:0;font-weight:700}
.hist td:nth-child(2){text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--cal);color:var(--gramado);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.placar.anim{animation:pulo .5s ease-out}@keyframes pulo{from{transform:scale(.7);opacity:.2}to{transform:none;opacity:1}}}

.esc-topo{display:flex;flex:0 0 auto}
.svg-escudo{display:block;overflow:visible}
.passos{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.passos li{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--cal-2);border-top:3px solid var(--gramado-3);padding-top:6px}
.passos li b{font-family:var(--f-display);font-size:16px}
.passos li.feito{border-top-color:var(--ok);color:var(--cal)}
.passos li[aria-current="step"]{border-top-color:var(--canario);color:var(--canario)}
.paises{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pais{background:var(--gramado-2);border:1.5px solid var(--gramado-3);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-size:13px}
.pais b{font-family:var(--f-display);font-size:22px;font-weight:700}
.pais[aria-pressed="true"]{border-color:var(--canario);background:var(--gramado-3)}
.previa{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--gramado-3),var(--gramado-2) 70%);border:1px solid var(--gramado-3);border-radius:16px;padding:18px;min-height:170px}
.grade8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.pen-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pen-jog{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:12px;background:rgba(255,255,255,.06);border:2px solid transparent;color:inherit;font:inherit}.pen-jog b{font-size:12px;line-height:1.1;text-align:center}.pen-jog small{opacity:.7;font-size:11px}.pen-jog.sel{border-color:#ffd23f;background:rgba(255,210,63,.12)}.pen-jog:disabled{opacity:1}

function siglaDe(nome){
  let s=nome.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\(.*?\)/g," ").replace(/[.'&]/g," ");
  let w=s.split(/[\s-]+/).filter(x=>x&&!/^(fc|afc|sc|sv|us|as|cf|cd|ud|vfb|vfl|tsg|tsv|ssv|de|del|da|do|y|e|la|le|les|el|los|the|of|and|hove|albion|1|91|43|05|04|96|98)$/i.test(x));
  if(!w.length)w=[s.trim()||"CLB"];
  const r=(w.length>=2&&w[1].length>=2&&!/^\d/.test(w[1]))?w[0][0]+w[1].slice(0,2):w[0].slice(0,3);
  return r.toUpperCase().padEnd(3,"X");
}
function corHash(nome,i){const P=["#c8102e","#0047ab","#00843d","#151515","#f5d000","#7a0026","#e8590c","#5b2a86"];let h=0;for(const c of nome)h=(h*31+c.charCodeAt(0))>>>0;return P[(h+i*3)%P.length]}

function abreviar(nome){
  if(ABREV_FIXO[nome])return ABREV_FIXO[nome];
  const m=nome.match(/^(.*?)\s*(\([^)]*\))\s*$/);
  const base=m?m[1]:nome,par=m?" "+m[2]:"";
  const partes=base.split(/[\s-]+/).filter(Boolean);
  const curta=w=>w.length<=5?w:w.slice(0,w.length-2)+".";
  if(partes.length===1)return curta(partes[0])+par;
  const resto=partes.slice(1).filter(w=>!/^(de|del|da|do|y|e|&|and|of|the)$/i.test(w));
  const seg=resto[0]||partes[1];

}

function salarioJog(p){
  const c=p.club!=null&&G.clubs[p.club];

  f*=.9+(hashId(p.id,3)%21)/100;

const elencoReal=n=>typeof ELENCOS_REAIS!=="undefined"&&ELENCOS_REAIS[n]||null;
function dadosReais(p,[n,pos,age,ov],oc){p.n=RENOMES[n]||n;if(oc)p.oc=oc;delete p.rf;p.pos=pos;p.age=age;p.ov=ov;p.pot=age<=23?clamp(ov+Math.max(2,(24-age)*2),ov,94):ov;p.real=1;p.sal=salarioJog(p)}

/* troca os jogadores sorteados dos clubes que já têm elenco real (save antigo) */
function aplicarElencosReais(){
  if(typeof ELENCOS_REAIS==="undefined")return;
  Object.values(G.clubs).forEach(c=>{
    const L=elencoReal(c.name);if(!L||c.user)return;
    /* tira jogadores reais repetidos (bug: elenco real era criado de novo a cada carregamento) */
    const vistos=new Set();jogadoresDo(c.id).forEach(p=>{if(!p.real)return;const k=p.n+"|"+p.pos+"|"+p.age;if(vistos.has(k)){p.club=null;tocou()}else vistos.add(k)});
    if(c.realV||jogadoresDo(c.id).some(p=>p.real)){c.realV=1;
      /* inventado que a IA contratou (save antigo) sai e o clube repõe com um real da mesma posição */
      jogadoresDo(c.id).forEach(p=>{if(!p.real&&!p.lenda&&!p.exU&&!p.empU){p.club=null;registrarSaida(c,p);tocou()}});return}
    const velhos=jogadoresDo(c.id).filter(p=>!p.real);
    L.forEach(r=>{const i=velhos.findIndex(p=>p.pos===r[1]);if(i>=0){dadosReais(velhos[i],r,c.name);velhos.splice(i,1)}else jogadorReal(r,c.id)});
    velhos.forEach(p=>{p.club=null});c.realV=1;tocou();
  });
  /* cópias antigas com nome abreviado (REPETIDOS_REAIS) saem de qualquer clube da IA, mesmo depois de transferidas */
  Object.values(G.players).forEach(p=>{const rep=p.real&&REPETIDOS_REAIS[p.oc],c=p.club!=null&&G.clubs[p.club];
    if(rep&&rep.includes(p.n)&&c&&!c.user){p.club=null;registrarSaida(c,p);tocou()}});
  Object.values(G.players).forEach(p=>{if((p.real||p.lenda)&&RENOMES[p.n])p.n=RENOMES[p.n]});
  if(G.lendas&&G.lendas["Neymar Júnior"]!=null){G.lendas["Neymar Jr"]=G.lendas["Neymar Júnior"];delete G.lendas["Neymar Júnior"]}
}

function roundRobin(ids){
  const a=shuffle(ids.slice()),n=a.length,rounds=[];
  for(let r=0;r<n-1;r++){
    const pr=[];
    for(let i=0;i<n/2;i++){const x=a[i],y=a[n-1-i];pr.push((r+i)%2?[y,x]:[x,y])}
    rounds.push(pr);a.splice(1,0,a.pop());
  }
  return rounds.concat(rounds.map(r=>r.map(([h,v])=>[v,h])));
}

function disponivel(p){return p.inj<=0&&!(p.susp>0)}
function fisF(p){return .7+.3*((p.fis??100)/100)}
const ovF=p=>p.ov*fisF(p);
/* energia (p.fis, 0–100): gasto por minuto em campo — 90 min ≈ 30 a 60 de energia */
const GASTO_POS={GOL:.3,ZAG:.42,LAT:.5,VOL:.52,MEI:.5,ATA:.47};
const fisico=p=>2-clamp(1.5-atributos(p).fis*.0078,.72,1.25); // atributo Preparo físico: 99 gasta 27% menos energia, 40 gasta 19% mais
function gastoMin(p,pos,est,ritmo){return (GASTO_POS[pos]||.45)*(ritmo||1)*(est==="of"?1.08:est==="def"?.94:1)*(p.age>=32?1.12:p.age<=23?.93:1)*(2-fisico(p))}
function gastar(p,v){if(p)p.fis=clamp((p.fis??100)-v,0,100)}
/* recuperação entre jogos: pouco gasto volta a 100; muito gasto volta a ~90–97, conforme os dias de descanso */
function recuperar(p,dias){const f=p.fis??100;if(f>=100)return;const def=100-f;
  if(def<=18){p.fis=100;return}
  const k=clamp(.3-.04*dias,.02,.26)*(p.age>=32?1.25:1)*(2-fisico(p));
  p.fis=Math.min(100,Math.round(100-def*k))}
const notaEsc=p=>ovF(p)-Math.max(0,70-(p.fis??100))*.12; // escalação: evita quem está muito cansado
/* dificuldade dos adversários: organização tática por divisão + momento (G4 e sequência recente) */
const TAT_TIER=[1.5,-.8,-2.2]; // Série A, B, C (vantagem tática da IA; 26/10/2026: C fácil, B mais difícil, A bem difícil — elenco na média da A briga contra a queda, +10 de força chega ao G4)
let MOM={ev:-1};
function momento(cid){
  if(MOM.ev!==G.ev||MOM.y!==G.year)MOM={ev:G.ev,y:G.year,m:{},cls:{}};
  if(cid in MOM.m)return MOM.m[cid];
  const c=G.clubs[cid];let v=0;
  if(c&&c.tier>=0&&c.tier<=2&&G.res&&G.res[c.tier]){const rs=G.res[c.tier].filter(Boolean);
    if(rs.length>=4){const cls=MOM.cls[c.tier]||(MOM.cls[c.tier]=classificacao(c.tier));const pos=cls.indexOf(cid)+1;
      if(pos>=1&&pos<=4)v+=[1.6,1.3,1.1,.9][pos-1];
      let f=0;rs.slice(-5).forEach(rd=>{const x=rd.find(g=>g[0]===cid||g[1]===cid);if(x){const gf=x[0]===cid?x[2]:x[3],gs=x[0]===cid?x[3]:x[2];f+=gf>gs?.3:gf<gs?-.25:0}});
      v+=clamp(f,-1,1.2)}}
  return MOM.m[cid]=v*.5; // 24/10: era .75 — o time mais forte da Série C terminava em 5º–8º
}
function bonusIA(cid){const c=G.clubs[cid];if(!c||c.user)return 0;if(c.amigo)return c.bt||0;return (c.tier>=0&&c.tier<=2?TAT_TIER[c.tier]:.8)+momento(cid)}

function jogadoresDo(cid){if(!IDX){IDX=new Map();for(const p of Object.values(G.players)){let l=IDX.get(p.club);if(!l){l=[];IDX.set(p.club,l)}l.push(p)}}return (IDX.get(cid)||[]).slice()}
function eficiencia(p,slot){
  if(p.pos===slot)return 1;
  const par={LAT:"ZAG",ZAG:"LAT",VOL:"MEI",MEI:"VOL",ATA:"MEI"};
  if(par[p.pos]===slot||par[slot]===p.pos)return .9;
  if(p.pos==="GOL"||slot==="GOL")return .55;
  return .8;
}
function melhorXI(cid,form){
  const disp=jogadoresDo(cid).filter(disponivel).sort((a,b)=>notaEsc(b)-notaEsc(a));
  const slots=FORMACOES[form].s,xi=new Array(slots.length).fill(null),usados=new Set();
  slots.forEach((s,i)=>{const p=disp.find(p=>p.pos===s&&!usados.has(p.id));if(p){xi[i]=p.id;usados.add(p.id)}});
  slots.forEach((s,i)=>{if(xi[i]==null){let best=null,bv=-1;disp.forEach(p=>{if(usados.has(p.id))return;const v=notaEsc(p)*eficiencia(p,s);if(v>bv){bv=v;best=p}});if(best){xi[i]=best.id;usados.add(best.id)}}});
  return xi;
}

/* troca de formação antes do jogo: quem já está escalado e cabe numa vaga da posição dele fica; as vagas que faltam (ex.: a formação pede 3 atacantes e só há 2) são completadas sozinhas com os melhores */
function adaptarEscalacao(form){
  const u=G.user,slots=FORMACOES[form].s,xi=new Array(slots.length).fill(null),us=new Set();
  const antigos=(u.lineup||[]).filter(id=>id!=null&&G.players[id]&&G.players[id].club===u.club&&disponivel(G.players[id]));
  slots.forEach((sl,i)=>{const id=antigos.find(id=>!us.has(id)&&G.players[id].pos===sl);if(id!=null){xi[i]=id;us.add(id)}});
  const disp=jogadoresDo(u.club).filter(p=>disponivel(p)).sort((a,b)=>notaEsc(b)-notaEsc(a));
  slots.forEach((sl,i)=>{if(xi[i]!=null)return;let p=disp.find(q=>!us.has(q.id)&&q.pos===sl);
    if(!p){let bv=-1;disp.forEach(q=>{if(us.has(q.id))return;const v=notaEsc(q)*eficiencia(q,sl);if(v>bv){bv=v;p=q}})}
    if(p){xi[i]=p.id;us.add(p.id)}});
  u.lineup=xi}
function validarEscalacao(){
  const u=G.user,slots=FORMACOES[u.form].s,trocas=[];
  if(!Array.isArray(u.lineup)||u.lineup.length!==slots.length)u.lineup=new Array(slots.length).fill(null);
  const usados=new Set();
  u.lineup=u.lineup.map(id=>{const p=G.players[id];if(!p||p.club!==u.club||!disponivel(p)||usados.has(id)){if(p&&p.club===u.club&&!disponivel(p))trocas.push(p.n);return null}usados.add(id);return id});
  if(u.lineup.some(x=>x==null)){
    const disp=jogadoresDo(u.club).filter(p=>disponivel(p)&&!usados.has(p.id)).sort((a,b)=>b.ov-a.ov);
    u.lineup=u.lineup.map((id,i)=>{if(id!=null)return id;let best=null,bv=-1;disp.forEach(p=>{if(usados.has(p.id))return;const v=p.ov*eficiencia(p,slots[i]);if(v>bv){bv=v;best=p}});if(best){usados.add(best.id);return best.id}return null});
  }
  return trocas;
}

function passivasTec(t){ // fixas por técnico (sorteadas pelo nome): nível 90+ tem 3, 80+ tem 2, os outros 1; interino não tem

function garcom(f,autor){
  if(rnd()>.75)return null;const pesos={GOL:.05,LAT:2,ZAG:.6,VOL:1.5,MEI:4,ATA:2.5};let tot=0;const l=[];
  f.xi.forEach((id,i)=>{const p=G.players[id];if(!p||p===autor)return;const w=pesos[f.slots[i]]*Math.pow(p.ov/60,2);tot+=w;l.push([p,w])});
  let r=rnd()*tot;for(const [p,w] of l){r-=w;if(r<=0)return p}return null;
}

  const pesos={GOL:0,LAT:1,ZAG:1,VOL:1.2,MEI:3,ATA:6};

  let r=rnd()*tot;for(const [p,w] of l){r-=w;if(r<=0)return p}return l.length?l[l.length-1][0]:null;
}
function simular(h,a,neutro,contaGols){

  const lh=clamp(mh*Math.exp((fh.att-fa.def)/k)*(.85+rnd()*.3),.15,4.5);
  const la=clamp(ma*Math.exp((fa.att-fh.def)/k)*(.85+rnd()*.3),.12,4.2);
  const gh=Math.min(poisson(lh),8),ga=Math.min(poisson(la),8);
  const sh=[],sa=[];
  for(let i=0;i<gh;i++){const p=artilheiro(fh);if(p){if(contaGols!==false){p.g++;const a=garcom(fh,p);if(a)a.as=(a.as||0)+1}sh.push([p.id,ri(1,90)])}}
  for(let i=0;i<ga;i++){const p=artilheiro(fa);if(p){if(contaGols!==false){p.g++;const a=garcom(fa,p);if(a)a.as=(a.as||0)+1}sa.push([p.id,ri(1,90)])}}
  sh.sort((x,y)=>x[1]-y[1]);sa.sort((x,y)=>x[1]-y[1]);

  [fh,fa].forEach(f=>{f.xi.forEach((id,i)=>{const p=G.players[id];if(p){p.j++;gastar(p,gastoMin(p,f.slots[i],"eq",ritmo)*90)}});

}

  // importância do jogo: adversário forte, topo da tabela e copa enchem o estádio
  let imp=0;const ev=G.cal[G.ev]||{};
  if(ev.k==="C")imp+=ev.d<6?.4:.55+.1*(ev.d-6);          // Libertadores/Champions: mata-mata e final lotam
  else if(ev.k==="N")imp+=.12+.07*(ev.d||0);             // copa nacional: cresce a cada fase

  if(ev.k==="L"&&G.ev>2){const n=G.tiers[c.tier].length,pa=posicaoDe(adv.id),pu=posicaoDe(uid);

    const R=nRodadas();if(ev.r>=R-6&&pu<=6)imp+=.12;}      // reta final brigando pelo acesso/título
  {const dt=dataEv(G.ev);if(dt&&dt.getDay()===3)imp-=.05}   // jogo em quarta-feira à noite

  {const P=[G.patro,G.patro2,G.material].filter(Boolean);if(P.length){fin.patro=P.reduce((x,o)=>x+o.porJogo,0);if(res==="v"){const b=P.reduce((x,o)=>x+(o.tipo==="vitoria"?o.bonus||0:0),0);if(b)fin.bonus=b}}}

/* ---------- evolução dos jogadores do usuário ---------- */
function xpNecessario(p){return Math.round(60+(p.ov-40)*2.2)}
function evoluir(r){
  const uid=G.user.club,casa=r.h===uid;
  const gf=casa?r.gh:r.ga,gs=casa?r.ga:r.gh;
  const res=gf>gs?"v":gf===gs?"e":"d";
  const sc=casa?r.sh:r.sa;
  const marcou={};sc.forEach(([id])=>marcou[id]=(marcou[id]||0)+1);
  const lista=r.part||G.user.lineup.map((id,i)=>[id,FORMACOES[G.user.form].s[i],90]).filter(x=>x[0]!=null);
  const subiram=[];
  const def={GOL:1,ZAG:.85,LAT:.7,VOL:.5,MEI:.15,ATA:0};
  const atk={GOL:0,ZAG:.1,LAT:.35,VOL:.4,MEI:.75,ATA:1};
  const ganho={};
  lista.forEach(([id,s,mins])=>{
    const p=G.players[id];if(!p||p.club!==uid)return;
    let x=2+(res==="v"?2:res==="e"?1:0);
    if(gs===0)x+=6*def[s];
    else if(gs>=3)x-=2*def[s];
    x+=Math.min(gf,4)*2*atk[s];
    if(gf===0)x-=1.5*atk[s];
    x+=(marcou[id]||0)*4;
    const fAge=p.age<=23?1.4:p.age<=29?1:.6;
    ganho[id]=Math.max(0,x*fAge)*clamp(mins/90,.25,1)*(G.tec?.55+G.tec.q/150:.95);
  });
  jogadoresDo(uid).forEach(p=>{
    const g=ganho[p.id]!=null?ganho[p.id]:.6;
    p.xp=(p.xp||0)+g;
    const need=xpNecessario(p);
    if(p.xp>=need&&p.ov<94){p.xp-=need;p.ov++;if(p.pot<p.ov)p.pot=p.ov;subiram.push(p)}
  });
  return {ganho,subiram};
}

const PREMIO_N30=5000;

/* destaque da loja: a cada 2 ou 3 trocas (G.destProx), um dos 3 melhores (não lenda) de um time da 1ª divisão — do seu país ou de fora */

function precoPedido(p){

  const craque=clamp(1-(p.ov-76)*.06,.55,1); // 27/10: força 77+ fica bem mais barata na loja (o valor sobe muito rápido com a força)
  const promo=!p.lenda&&G.diario&&G.diario.promo===p.id&&p.club!==G.user.club?(t===-1?.55:.72):1; // oferta especial da loja: bom preço

const TV_RENOV=1.5; // renovação ao subir de série: +50% para todas; na mesma série renova pelo mesmo valor
function gerarTV(){const L=emissorasDe();if(!L)return null;const c=G.clubs[G.user.club],f=()=>.9+rnd()*.2,EM=EMISSORAS[G.country];
  const baseT=t=>9*econ(G.tierBase[t])*(FREC[t]??1)*(.6+(c.fama||0)/80)*(MULT_PATRO[t]??1),base=baseT(c.tier);

/* premiação individual do campeonato (26/10): craque, artilheiro, garçom, goleiro menos vazado, revelação e seleção 4-3-3.
   Quem ganha prêmio individual: +3 de força, +500 mil no valor (p.vb) e selo no perfil (p.selos); seleção ganha só o selo */
const PREMIO_FORCA=3,PREMIO_VALOR=500;
const PTS_CAMP=[[10,8,6],[8,6,4],[5,4,3]]; // pontos de treino pela colocação (1º, 2º, 3º) na Série A, B e C, tipos sorteados
function premiosCamp(t,tab){
  const n=tab.length,R=Math.max(1,(n-1)*2),posT={};tab.forEach((id,i)=>posT[id]=i);
  const L=Object.values(G.players).filter(p=>p.club in posT&&(p.j||0)>=Math.max(3,R*.35));
  const nota=p=>p.nn>=3?p.nt/p.nn:null;
  const sc=p=>{const nt=nota(p),def=["GOL","ZAG","LAT"].includes(p.pos);return (p.ov-60)*.45+(p.g||0)*(def?1.6:.9)+(p.as||0)*.6+(nt?(nt-6.5)*4:0)+(n-posT[p.club])/n*6+(p.j||0)/R*3};
  const S=p=>p?{id:p.id,n:p.n,pos:p.pos,age:p.age,c:p.club,g:p.g||0,as:p.as||0,j:p.j||0,nt:nota(p)?Math.round(nota(p)*10)/10:null}:null;
  const ord=L.slice().sort((a,b)=>sc(b)-sc(a));
  const craque=ord.find(p=>p.pos!=="GOL");
  const art=L.filter(p=>p.g>0).sort((a,b)=>b.g-a.g||a.j-b.j)[0];
  const gar=L.filter(p=>p.as>0).sort((a,b)=>b.as-a.as||a.j-b.j)[0];
  let gol=null,golGc=0;
  for(const cid of tab.slice().sort((a,b)=>(G.st[a].gc-G.st[b].gc)||posT[a]-posT[b])){const g=L.filter(p=>p.club===cid&&p.pos==="GOL").sort((a,b)=>b.j-a.j)[0];if(g){gol=g;golGc=G.st[cid].gc;break}}
  const rev=ord.find(p=>p.age<=21);
  const usados=new Set(gol?[gol.id]:[]),sel=[gol];
  ["LAT","ZAG","ZAG","LAT","VOL","MEI","MEI","ATA","ATA","ATA"].forEach(pos=>{const p=ord.find(x=>x.pos===pos&&!usados.has(x.id))||ord.find(x=>x.pos!=="GOL"&&!usados.has(x.id));if(p)usados.add(p.id);sel.push(p||null)});
  const L_=nomeLiga(t),ano=G.year,selo=(p,txt)=>{if(p)(p.selos=p.selos||[]).push(`${txt} ${ano}`)};
  const ind=[[craque,"Craque da "+L_],[art,"Artilheiro da "+L_],[gar,"Garçom da "+L_],[gol,"Goleiro menos vazado da "+L_],[rev,"Revelação da "+L_]];
  const premiados=new Set();
  ind.forEach(([p,txt])=>{if(!p)return;selo(p,txt);if(!premiados.has(p.id)){premiados.add(p.id);p.ov=clamp(p.ov+PREMIO_FORCA,30,99);p.pot=Math.max(p.pot||0,p.ov);p.vb=(p.vb||0)+PREMIO_VALOR}});
  sel.forEach(p=>selo(p,"Seleção da "+L_));
  const out={craque:S(craque),art:S(art),gar:S(gar),gol:S(gol),rev:S(rev),sel:sel.map(S)};if(out.gol)out.gol.gc=golGc;
  return out}
/* quem sobe de série ganha +2 de força no elenco todo; quem cai perde 1 (MUDA_SERIE) */

      else{p.ct=(p.ct??2)-1;if(p.ct<=0){saidas.push(p.n);p.club=null;delete p.ct}}}

  Object.values(G.players).forEach(p=>{

  {const livres=Object.values(G.players).filter(p=>p.club==null).sort((a,b)=>b.ov-a.ov);livres.slice(160).forEach(p=>delete G.players[p.id]);}tocou();
  for(let i=0;i<25;i++)novoJogador(pick(ELENCO_BASE),ri(G.tierBase[2]-6,G.tierBase[0]-4),null);

/* sufixos de milhão/mil e formato de número por idioma da tela */
const FMT_LG={pt:["pt-BR","mi","mil"],es:["es-ES","M","mil"],en:["en-GB","m","k"],fr:["fr-FR","M","k"],de:["de-DE","Mio.","Tsd."]};
function fmtGrana(m,k){const [loc,mi,mil]=FMT_LG[typeof idioma==="function"?idioma():"pt"];
  return k>=1000?`${m} ${(k/1000).toLocaleString(loc,{minimumFractionDigits:1,maximumFractionDigits:1})} ${mi}`:`${m} ${Math.round(k).toLocaleString(loc)} ${mil}`}
function dinheiro(k){
  const m=G?pais().moeda:"R$";
  const neg=k<0;k=Math.abs(k);
  return (neg?"−":"")+fmtGrana(m,k);
}

function pincel(cv){
  const r=cv.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  const x=cv.getContext("2d");if(!x)return;x.scale(dpr,dpr);
  const W=r.width,H=r.height;let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647;
  const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0a2a9a");g.addColorStop(1,"#040d33");x.fillStyle=g;x.fillRect(0,0,W,H);
  const cores=["#19c3ff","#ff2d8a","#ffffff","#2a6bff","#0b3ad0","#19c3ff","#ff2d8a","#7fdcff"];
  const ang=-0.62;const dx=Math.cos(ang),dy=Math.sin(ang);
  for(let i=0;i<70;i++){
    const cx=R()*W*1.4-W*.2,cy=R()*H*1.2-H*.1,len=W*(.4+R()*.9),esp=4+R()*R()*46;
    const c=cores[Math.floor(R()*cores.length)];
    x.globalAlpha=c==="#ffffff"?.55+R()*.4:.6+R()*.4;x.fillStyle=c;
    x.beginPath();
    const nx=-dy,ny=dx,n=18;
    for(let k=0;k<=n;k++){const t=k/n,px=cx+dx*len*(t-.5),py=cy+dy*len*(t-.5),w=esp*(1-Math.pow(Math.abs(t-.5)*2,3))*(.7+R()*.5);x.lineTo(px+nx*w/2,py+ny*w/2)}
    for(let k=n;k>=0;k--){const t=k/n,px=cx+dx*len*(t-.5),py=cy+dy*len*(t-.5),w=esp*(1-Math.pow(Math.abs(t-.5)*2,3))*(.7+R()*.5);x.lineTo(px-nx*w/2,py-ny*w/2)}
    x.fill();
    for(let k=0;k<6;k++){x.beginPath();x.arc(cx+dx*len*(R()-.5)+(R()-.5)*30,cy+dy*len*(R()-.5)+(R()-.5)*30,R()*3+.5,0,7);x.fill()}
  }
  x.globalAlpha=1;
}

function rodaIniciar(r){
  if(!r)return;const its=[...r.children];
  const marca=()=>{const m=r.scrollTop+r.clientHeight/2;let melhor=null,d0=1e9;
    its.forEach(it=>{const d=Math.abs(it.offsetTop+it.offsetHeight/2-m);const k=Math.min(d/it.offsetHeight,1.5);it.style.setProperty("--k",k.toFixed(2));if(d<d0){d0=d;melhor=it}});
    if(r._sel&&melhor!==r._sel){somRoleta();vibrar("roleta")}r._sel=melhor;
    its.forEach(it=>it.classList.toggle("sel",it===melhor))};
  let tq=0;r.addEventListener("scroll",()=>{marca();cancelAnimationFrame(tq);tq=requestAnimationFrame(marca)},{passive:true});
  requestAnimationFrame(()=>{const i0=its[0];r.scrollTop=i0.offsetTop+i0.offsetHeight/2-r.clientHeight/2;marca()});
}

/* ---------- idiomas: a tela fica na língua do país da carreira (dicionário em dados/idiomas.js) ---------- */
function idioma(){return G&&!G.tradutor&&IDIOMA_PAIS[G.country]||"pt"}
const TR_CACHE={};
function trIndice(lg){if(TR_CACHE[lg])return TR_CACHE[lg];
  const ex=new Map(),pats=[],frags=[],P=IDIOMAS.pt,T=IDIOMAS[lg];
  P.forEach((pt,i)=>{const t=T[i];if(!t||t===pt)return;
    if(!/\{\d+\}/.test(pt)){ex.set(pt,t);if(/^[a-zà-ú]/.test(pt)&&pt.includes(" ")&&pt.length>=10)frags.push([pt,t]);return}
    const ord=[],partes=pt.replace(/(\{\d+\})(?:\{\d+\})+/g,"$1").split(/\{(\d+)\}/);let re="^",chave="";
    partes.forEach((s,j)=>{if(j%2){ord.push(s);re+="(.*?)"}else{re+=s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");if(s.trim().length>chave.length)chave=s.trim()}});
    if(chave.length<2)return;const tam=partes.filter((s,j)=>!(j%2)).join("").length;
    pats.push({re:new RegExp(re+"$"),ord,t,chave,tam,solto:tam<6&&partes[0]===""})});
  pats.sort((x,y)=>y.tam-x.tam); // frase com mais texto fixo primeiro
  frags.push([", passe de ",{es:", pase de ",en:", assist by ",fr:", passe de ",de:", Vorlage von "}[lg]],[", no ",{es:", en el ",en:", at ",fr:", au ",de:", im "}[lg]]);
  frags.sort((a,b)=>b[0].length-a[0].length);
  return TR_CACHE[lg]={ex,pats,frags}}
function trTexto(s,lg,fundo){const I=trIndice(lg),d=I.ex.get(s);if(d!==undefined)return d;
  if(fundo>1)return trFrags(s,I);
  for(const p of I.pats){if(!s.includes(p.chave))continue;const m=s.match(p.re);if(!m)continue;
    if(p.solto&&m.slice(1).some(g=>/[a-zà-ÿ]{3,}/.test(g)))continue; // padrão curto tipo "{0} de {1}" só com números
    const val={};p.ord.forEach((n,i)=>{const g=m[i+1];val[n]=g.trim()?(trTexto(g.trim(),lg,(fundo||0)+1)??g):g;if(val[n]!==g&&/^\s/.test(g))val[n]=" "+val[n]});
    return p.t.replace(/\{(\d+)\}/g,(_,n)=>val[n]??"")}
  const em=s.match(/^([^\p{L}\d]+)(\p{L}.*)$/u);if(em){const t=trTexto(em[2],lg,fundo);if(t!=null)return em[1]+t} // emoji ou símbolo na frente
  for(const sep of [" · ",": "])if(s.includes(sep)){let mudou=false;const r=s.split(sep).map(x=>{const t=trTexto(x,lg,fundo);if(t!=null){mudou=true;return t}return x});if(mudou)return r.join(sep)}
  return trFrags(s,I)}
function trFrags(s,I){let r=s;for(const [a,b] of I.frags)if(r.includes(a))r=r.split(a).join(b);return r===s?null:r}
const TR_ATTR=["placeholder","aria-label","title"];
function traduzirNo(raiz,lg){
  const pular=el=>el.closest&&el.closest("[data-notr],script,style,textarea,text");
  if(raiz.nodeType===3){const el=raiz.parentElement;if(!el||pular(el))return;trNoTexto(raiz,lg);return}
  if(raiz.nodeType!==1||pular(raiz))return;
  const w=document.createTreeWalker(raiz,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode:n=>n.nodeType===1?(n.matches("[data-notr],script,style,textarea,svg")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_SKIP):NodeFilter.FILTER_ACCEPT});
  let n;while((n=w.nextNode()))trNoTexto(n,lg);
  [raiz,...raiz.querySelectorAll("[placeholder],[aria-label],[title]")].forEach(el=>{if(el.closest("[data-notr]"))return;TR_ATTR.forEach(a=>{const v=el.getAttribute&&el.getAttribute(a);if(!v)return;const t=trTexto(v.replace(/\s+/g," ").trim(),lg,0);if(t!=null)el.setAttribute(a,t)})})}
function trNoTexto(n,lg){const v=n.nodeValue;if(!v||!/[A-Za-zÀ-ÿ]/.test(v))return;
  const s=v.replace(/\s+/g," ").trim();const t=trTexto(s,lg,0);if(t==null)return;
  const a=v.match(/^\s*/)[0],b=v.match(/\s*$/)[0];n.nodeValue=(a?" ":"")+t+(b?" ":"")}
const TR_OBS=new MutationObserver(ms=>{const lg=idioma();if(lg==="pt"||typeof IDIOMAS==="undefined")return;
  ms.forEach(m=>{if(m.type==="characterData")traduzirNo(m.target,lg);else m.addedNodes.forEach(n=>traduzirNo(n,lg))});TR_OBS.takeRecords()});
TR_OBS.observe(document.body,{childList:true,subtree:true,characterData:true});

    <div class="carrossel" id="carrossel">${ks.map(k=>{const P=PAISES[k];return `<button class="pais-card${paisLivre(k)?"":" pais-tranc"}" data-a="wpais" data-v="${k}" aria-pressed="${W.pais===k}">
      <div class="bandeira">${bandeiraSVG(k)}</div>
      <b class="pais-nome">${P.nome}</b>
      <span class="pais-desc">Começa na <strong>${P.ligas[2]}</strong><br>Sobe para ${P.ligas[1]} e ${P.ligas[0]}<br>Copa continental: ${COPAS[P.cont].main}</span>

    <div class="pontos-car">${ks.map(k=>`<i class="${W.pais===k?"on":""}" data-k="${k}"></i>`).join("")}</div>`;
  }else if(p===3){
    h+=editorEscudo(W.escudo,W.nome.trim()||"Seu Clube");
  }else if(p===4){
    h+=editorUniforme(W.unis,W.escudo);
  }else{
    const nomeE=(W.estadio||"").trim()||`Arena ${W.nome.trim()||"do Clube"}`;
    if(!W.estComprado){
      h+=`<h2 style="margin-top:0">Estádio</h2><div class="oferta-est"><b style="font-size:17px">O ${esc(W.nome.trim()||"seu clube")} ainda não tem estádio.</b>
      <p style="margin:6px 0 12px">Temos uma oferta para você! Um estádio municipal está à venda por <b>${dinheiroPais(W.pais,precoEstadioFund(W.pais))}</b>. Você tem ${dinheiroPais(W.pais,caixaFundacao(W.pais))} em caixa, então ainda sobra um dinheirinho.</p>

    }else{

      <p class="muted peq">Pago ${dinheiroPais(W.pais,precoEstadioFund(W.pais))}. Sobraram ${dinheiroPais(W.pais,caixaFundacao(W.pais)-precoEstadioFund(W.pais))} no caixa. Começa com ${ESTADIO_INICIAL.toLocaleString("pt-BR")} lugares. Cada reforma na aba Upgrades deixa o estádio maior e mais bonito: 2 reformas na ${esc(PAISES[W.pais].ligas[2])}, mais 3 na ${esc(PAISES[W.pais].ligas[1])} e as 3 últimas na ${esc(PAISES[W.pais].ligas[0])}, até a inauguração da arena coberta.</p>`;
    }
  }
  h+=`<div class="linha" style="gap:10px">${p>1?`<button class="btn" data-a="wvoltar" style="flex:1">Voltar</button>`:""}${p<5||W.estComprado?`<button class="btn prim" data-a="wseguir" style="flex:2">${p<5?"Continuar":"Fundar clube"}</button>`:""}</div>`;

  h+=`</div>`;
  app.innerHTML=h;

function bandeiraSVG(k){
  const v='viewBox="0 0 300 200" width="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"';
  if(k==="BRA")return `<svg ${v}><rect width="300" height="200" fill="#009c3b"/><path d="M150 22L276 100L150 178L24 100Z" fill="#ffdf00"/><circle cx="150" cy="100" r="44" fill="#002776"/><path d="M107 92Q150 78 193 106L192 115Q150 88 108 101Z" fill="#fff"/>${[[130,120],[145,128],[160,122],[170,112],[138,108],[152,138],[124,132]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="1.8" fill="#fff"/>`).join("")}</svg>`;
  if(k==="ARG")return `<svg ${v}><rect width="300" height="200" fill="#74acdf"/><rect y="66.7" width="300" height="66.7" fill="#fff"/><circle cx="150" cy="100" r="15" fill="#f6b40e"/>${Array.from({length:16},(_,i)=>{const a=i*Math.PI/8;return `<path d="M${150+17*Math.cos(a-.12)} ${100+17*Math.sin(a-.12)}L${150+27*Math.cos(a)} ${100+27*Math.sin(a)}L${150+17*Math.cos(a+.12)} ${100+17*Math.sin(a+.12)}Z" fill="#f6b40e"/>`}).join("")}<circle cx="150" cy="100" r="15" fill="none" stroke="#85340a" stroke-width="1.2"/></svg>`;
  if(k==="ENG")return `<svg ${v}><rect width="300" height="200" fill="#fff"/><rect x="130" width="40" height="200" fill="#ce1124"/><rect y="80" width="300" height="40" fill="#ce1124"/></svg>`;
  if(k==="ESP")return `<svg ${v}><rect width="300" height="200" fill="#aa151b"/><rect y="50" width="300" height="100" fill="#f1bf00"/></svg>`;
  if(k==="GER")return `<svg ${v}><rect width="300" height="67" fill="#000"/><rect y="66.7" width="300" height="67" fill="#dd0000"/><rect y="133.3" width="300" height="66.7" fill="#ffce00"/></svg>`;
  if(k==="FRA")return `<svg ${v}><rect width="100" height="200" fill="#002395"/><rect x="100" width="100" height="200" fill="#fff"/><rect x="200" width="100" height="200" fill="#ed2939"/></svg>`;
  return "";
}
function ligarCarrossel(){
  const car=$("#carrossel");if(!car||car.dataset.ok)return;car.dataset.ok="1";
  const cards=[...car.querySelectorAll(".pais-card")];
  const alvo=cards.find(c=>c.dataset.v===W.pais);if(alvo)car.scrollLeft=alvo.offsetLeft-(car.clientWidth-alvo.clientWidth)/2;
  let t;car.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{
    const meio=car.scrollLeft+car.clientWidth/2;let best=cards[0],bd=1e9;
    cards.forEach(c=>{const d=Math.abs(c.offsetLeft+c.clientWidth/2-meio);if(d<bd){bd=d;best=c}});
    selecionarPais(best.dataset.v);
  },110)},{passive:true});
}
/* países liberados pelo maior nível já atingido (qualquer carreira, guardado em fut-nivmax) */
const PAIS_NIVEL={BRA:1,ARG:10,GER:15,FRA:20,ENG:25,ESP:30};
function nivelMax(){let n=1;try{n=+localStorage.getItem("fut-nivmax")||1}catch(e){}const g=G&&G.perfil&&G.perfil.nivel||1;if(g>n){n=g;try{localStorage.setItem("fut-nivmax",n)}catch(e){}}return n}
const paisLivre=k=>nivelMax()>=(PAIS_NIVEL[k]||1);
function selecionarPais(k){
  W.pais=k;
  document.querySelectorAll(".pais-card").forEach(c=>{const on=c.dataset.v===k;c.setAttribute("aria-pressed",on);if(PAIS_NIVEL[c.dataset.v]&&!paisLivre(c.dataset.v))return;c.querySelector(".pais-ok").textContent=on?"Selecionado":"Toque para escolher"});
  document.querySelectorAll(".pontos-car i").forEach(i=>i.classList.toggle("on",i.dataset.k===k));
}

function escGuardar(e){e=e||alvoVisual().e;if(ESC_H.alvo!==e){ESC_H.alvo=e;ESC_H.p=[];ESC_H.i=-1}const j=JSON.stringify(e);if(ESC_H.p[ESC_H.i]===j)return;

const PROMPT_ESCUDO=`Crie o escudo de um time de futebol fictício para usar num jogo de celular.

DESIGN DO ESCUDO (preencha):
- Nome do time: [escreva aqui]
- Cores principais: [ex.: azul-marinho e dourado]
- Símbolo ou mascote: [ex.: tubarão, leão, estrela, nenhum]
- Formato do escudo: [ex.: clássico, redondo, moderno]
- Estilo: [ex.: moderno e minimalista, tradicional, agressivo]
- Texto dentro do escudo (opcional): [ex.: sigla, ano de fundação]

ENQUADRAMENTO E EXIGÊNCIAS (não altere):
- Imagem quadrada, 1024 x 1024 pixels.
- Somente o escudo, centralizado, ocupando cerca de 90% da imagem, sem cortar nenhuma borda.
- Fundo totalmente transparente (PNG). Se não for possível, fundo branco liso, sem textura e sem sombra.
- Escudo de frente e plano, estilo emblema/vetor, sem 3D exagerado, sem mockup, sem camisa, sem parede e sem reflexos.
- Contornos nítidos e cores sólidas e fortes, para ficar legível mesmo bem pequeno.
- Sem marca d'água, sem assinatura e sem nenhum texto fora do escudo.`;
function copiarTexto(t){const ok=()=>toast("Prompt copiado! Cole no ChatGPT.");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>copiarAntigo(t,ok));else copiarAntigo(t,ok)}
function copiarAntigo(t,ok){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();try{document.execCommand("copy");ok()}catch(e){toastErro("Não deu para copiar.")}a.remove()}
// recebe a imagem: tira fundo liso (cor dos cantos), recorta e encaixa no formato do escudo
function processarEscudoUpload(f){return new Promise((ok,er)=>{if(!f||!/^image\//.test(f.type))return er("Escolha uma imagem.");const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
  const M=420,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);
  const D=x.getImageData(0,0,w,h),d=D.data,px=(i,j)=>(j*w+i)*4,cs=[px(0,0),px(w-1,0),px(0,h-1),px(w-1,h-1)];
  const opaco=cs.every(i=>d[i+3]>240),ref=[d[cs[0]],d[cs[0]+1],d[cs[0]+2]],perto=i=>Math.abs(d[i]-ref[0])+Math.abs(d[i+1]-ref[1])+Math.abs(d[i+2]-ref[2])<60;
  if(opaco&&cs.every(perto)){const vis=new Uint8Array(w*h),pil=[];for(let i=0;i<w;i++){pil.push(i,0,i,h-1)}for(let j=0;j<h;j++){pil.push(0,j,w-1,j)}
    while(pil.length){const j=pil.pop(),i=pil.pop();if(i<0||j<0||i>=w||j>=h)continue;const q=j*w+i;if(vis[q])continue;vis[q]=1;if(!perto(q*4))continue;d[q*4+3]=0;pil.push(i+1,j,i-1,j,i,j+1,i,j-1)}x.putImageData(D,0,0)}
  let x0=w,y0=h,x1=0,y1=0;for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(d[px(i,j)+3]>20){if(i<x0)x0=i;if(i>x1)x1=i;if(j<y0)y0=j;if(j>y1)y1=j}
  if(x1<=x0||y1<=y0)return er("A imagem parece vazia.");
  const W=216,H=248,cw=x1-x0+1,ch=y1-y0+1,s2=Math.min(W/cw,H/ch),o=document.createElement("canvas");o.width=W;o.height=H;
  o.getContext("2d").drawImage(c,x0,y0,cw,ch,(W-cw*s2)/2,(H-ch*s2)/2,cw*s2,ch*s2);ok(o.toDataURL("image/png"))};im.onerror=()=>er("Não consegui abrir essa imagem.");im.src=rd.result};rd.readAsDataURL(f)})}

function ehLenda(p){if(!p)return false;if(p.lenda)return true;if(!NOMES_LENDA)NOMES_LENDA=new Map(LENDAS.map(l=>[l[0],l[1]]));const ps=NOMES_LENDA.get(LENDA_ALIAS[p.n]||p.n);const setor=x=>x==="GOL"?0:x==="ZAG"||x==="LAT"?1:2;return !!ps&&setor(ps)===setor(p.pos)} // 26/10: só quem está na lista LENDAS; homônimo de outro setor (Marquinhos atacante, Alisson meia) não vale; Neymar meia/atacante vale

function precoLendaDin(l){return premioEmDinheiro(l[3]*1500)}

function salarioLenda(p){

  const teto=Object.values(G.players).reduce((m,q)=>q.lenda||ehLenda(q)?m:Math.max(m,q.sal||0),0);
  return Math.round(Math.max(salarioJog(p)*1.8,teto*(1.05+cp/250))*10)/10;
}

  if(modo==="c"){if(cupons()<l[3])return `Faltam ${l[3]-cupons()} cupons dourados.`;G.cupons-=l[3]}
  else{const v=precoLendaDin(l);if(G.cash<v)return `Faltam ${dinheiro(v-G.cash)}.`;G.cash-=v}
  const uid=G.user.club,real=Object.values(G.players).find(p=>!p.lenda&&p.club!==uid&&(LENDA_ALIAS[p.n]||p.n)===l[0]),de=real&&real.club!=null&&G.clubs[real.club];
  const id=real?real.id:novoJogador(l[1],l[2],uid,l[4]);const p=G.players[id];if(real){p.club=uid;p.pos=l[1];delete p.venda;delete p.ctFim;if(de)addNoticia(`${l[0]} deixa o ${de.name} e acerta com o ${G.clubs[uid].name}!`,"mercado")}p.n=l[0];p.ov=l[2];p.pot=l[4]<=23?Math.min(97,l[2]+3):l[2];p.age=l[4];p.ct=3;p.lenda=1;p.sal=salarioLenda(p);tocou();
  G.lendas[l[0]]=id;G.inbox.unshift({t:"bom",m:`${l[0]} chegou! A lenda vai vestir a camisa do ${G.clubs[uid].name}.`});perfil().comp=(perfil().comp||0)+1;perfil().lendaC=(perfil().lendaC||0)+1;xpBonus(300,"lenda contratada");return null;
}

function pagarLenda(i){

function semAc(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim()}
function edResultados(){
  const q=semAc(edSel.busca);if(q.length<2)return "";

  const dest=D&&(D.r||D.prox)?[(D.r||D.prox).h,(D.r||D.prox).a]:[];
  const zona=i=>t===0?(i<C.mq?"z1":i<C.mq+C.sq?"z2":i>=n-k?"z4":""):(i<k?"z2":i>=n-k?"z4":"");
  const u5=l=>l.map(x=>`<i class="u5 ${x}">${x==="v"?"✓":x==="d"?"✕":"–"}</i>`).join("");
  return `<div class="cartao lg-tab"><div class="lg-rolar"><table><thead><tr><th class="fx">Clube</th><th>Pts</th><th>PJ</th><th>VIT</th><th>E</th><th>DER</th><th>GM</th><th>GC</th><th>SG</th><th>Últimas 5</th></tr></thead><tbody>${cl.map((id,i)=>{const s=G.st[id],c=G.clubs[id],pj=s.v+s.e+s.d;
    return `<tr class="${zona(i)}${id===uid?" meu":dest.includes(id)?" dest":""}" data-a="ligafoco" data-v="${id}"><td class="fx"><span class="lg-cl"><b class="num">${i+1}</b>${marcaDe(c,22)}<span>${esc(c.name)}</span></span></td><td class="num pts">${s.pts}</td><td class="num">${pj}</td><td class="num">${s.v}</td><td class="num">${s.e}</td><td class="num">${s.d}</td><td class="num">${s.gp}</td><td class="num">${s.gc}</td><td class="num">${s.gp-s.gc}</td><td class="u5s">${u5(ultimos5(t,id))}</td></tr>`}).join("")}</tbody></table></div>
    <div class="lg-leg"><b>Classificação/Rebaixamento</b>${t===0?`<span><i class="z1"></i>Fase de grupos da ${esc(C.main)}</span><span><i class="z2"></i>Fase de grupos da ${esc(C.sec)}</span>`:`<span><i class="z2"></i>Acesso para a ${esc(P.ligas[t-1])}</span>`}${t<2?`<span><i class="z4"></i>Rebaixamento</span>`:""}
    <b style="margin-top:8px">Últimas 5 partidas</b><span><i class="u5 v">✓</i>Vitórias</span><span><i class="u5 e">–</i>Empates</span><span><i class="u5 d">✕</i>Derrota</span></div></div>`}
/* mais partidas: confrontos entre os dois times do destaque e os jogos da última rodada */
/* mais partidas do time em foco: anteriores em cima e próximas embaixo; a tela abre já nas próximas (rolando para cima aparecem as anteriores) */
function ligaMais(t,D){const id=focoLiga(t),c=G.clubs[id],uid=G.user.club,{ant,prox}=partidasDoTime(t,id);
  if(id===uid){const m=partidaAtual();if(m&&m.tipo!=="L")prox.unshift({h:m.h,a:m.a,rot:m.rot,copa:1})}
  const linha=(id2,g,ganhou,perdeu)=>{const C=G.clubs[id2];return `<div class="${perdeu?"perde":""}">${marcaDe(C,24)}<span class="lg-nm">${esc(C.name)}</span>${g!=null?`<b class="num">${g}</b>${ganhou?'<i>◀</i>':'<i></i>'}`:""}</div>`};
  const cAnt=r=>{const d=dataRodada(r.rodada);return `<div class="cartao lg-jogo"><div class="lg-jl">${linha(r.h,r.gh,r.gh>r.ga,r.gh<r.ga)}${linha(r.a,r.ga,r.ga>r.gh,r.ga<r.gh)}</div><div class="lg-jr"><b>FIM</b><small>${d?fmtData(d)+"/"+String(d.getFullYear()).slice(2):""}</small><small>Rod. ${r.rodada}</small></div></div>`};
  const cProx=r=>{const d=r.rodada?dataRodada(r.rodada):dataEv(G.ev);return `<div class="cartao lg-jogo"><div class="lg-jl">${linha(r.h)}${linha(r.a)}</div><div class="lg-jr"><b>${d?DIAS_SEM[d.getDay()].slice(0,3):""}</b><small>${d?fmtData(d):""}</small><small>${r.rodada?`Rod. ${r.rodada}`:esc((r.rot||"").replace(/ · .*/,""))}</small></div></div>`};
  ligaRolar=true;
  return `<div class="lg-foco">${marcaDe(c,22)}<span>Partidas do <b>${esc(c.name)}</b></span></div>`+
    (ant.length?`<h2>Partidas anteriores</h2>`+ant.map(cAnt).join(""):"")+
    `<h2 id="lg-agora">Próximas partidas</h2>`+(prox.length?prox.map(cProx).join(""):`<div class="cartao lg-vazio">Sem mais partidas nesta temporada.</div>`)}

function ligaElenco(t){const id=focoLiga(t),c=G.clubs[id],el=jogadoresDo(id),ord={GOL:0,LAT:1,ZAG:2,VOL:3,MEI:4,ATA:5},nomes={GOL:"Goleiros",LAT:"Laterais",ZAG:"Zagueiros",VOL:"Volantes",MEI:"Meias",ATA:"Atacantes"};
  const val=el.reduce((x,p)=>x+valor(p),0),med=el.length?Math.round(el.reduce((x,p)=>x+p.ov,0)/el.length):0;
  let h=`<div class="lg-foco">${marcaDe(c,22)}<span>Elenco do <b>${esc(c.name)}</b> · ${el.length} jogadores · média ${med} · ${dinheiro(val)}</span></div>`;
  if(id!==G.user.club)try{h+=cartaoTecClube(id)}catch(e){}
  Object.keys(ord).forEach(pos=>{const ps=el.filter(p=>p.pos===pos).sort((a,b)=>b.ov-a.ov);if(!ps.length)return;
    h+=`<h2>${nomes[pos]}</h2><div class="cartao" style="padding-block:4px">${ps.map(p=>`<div class="jog${lendaCls(p)}" data-a="perfil" data-v="${p.id}" style="cursor:pointer">${linhaJog(p,"")}</div>`).join("")}</div>`});
  return h}
function ligaArt(t){const ids=new Set(G.tiers[t]);
  const art=Object.values(G.players).filter(p=>ids.has(p.club)&&p.g>0).sort((a,b)=>b.g-a.g||b.ov-a.ov).slice(0,15);
  return `<h2>Artilharia</h2><div class="cartao" style="padding-block:4px">${art.length?art.map((p,i)=>`<div class="jog" data-a="perfil" data-v="${p.id}" style="cursor:pointer"><div class="posb ${p.pos}">${i+1}º</div>${rostoSVG(p,34)}<div class="nm"><b>${esc(p.n)}</b><span>${esc(G.clubs[p.club].name)} · ${p.pos}</span></div><b class="num" style="font-size:20px">${p.g}</b></div>`).join(""):'<p class="muted">Ninguém marcou ainda.</p>'}</div>`}
function modalLigaSel(){const P=pais(),ops=[0,1,2].map(t=>[String(t),P.ligas[t]]);if(G.copaN)ops.push(["copan",G.copaN.nome||"Copa nacional"]);if(G.cup)ops.push(["copa",G.cup.nome]);

  modal(`<b class="etapa">Escolha o campeonato</b><div class="lg-ops">${ops.map(([v,n])=>`<button class="cartao" data-a="ligat" data-v="${v}" aria-pressed="${v===atual}">${esc(n)}${v===String(userTier())?' <small>· seu time</small>':""}</button>`).join("")}</div><div class="botoes"><button class="btn" data-a="fechar">Fechar</button></div>`)}

function tabelaHTML(cl,st,zona){
  return `<table><thead><tr><th>#</th><th>Clube</th><th>P</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr></thead><tbody>${cl.map((id,i)=>{const s=st[id],c=G.clubs[id];
    return `<tr class="${zona(i)}${c.user?" meu":""}" data-a="vertime" data-v="${id}" style="cursor:pointer"><td class="pos">${i+1}</td><td><span class="linha" style="gap:8px">${marcaDe(c,24)}<span>${esc(c.name)}</span></span></td><td class="pts">${s.pts}</td><td>${s.j}</td><td>${s.v}</td><td>${s.e}</td><td>${s.d}</td><td>${s.gp-s.gc>0?"+":""}${s.gp-s.gc}</td></tr>`}).join("")}</tbody></table>`;
}

function telaAbaCopa(){
  const cup=G.cup;if(!cup){aba="inicio";return telaInicio()}
  const uid=G.user.club;
  const g=cup.groups.find(g=>g.includes(uid)),gi=cup.groups.indexOf(g);
  const pos=g?grupoOrdenado(g).indexOf(uid)+1:0;
  const status=cup.champ===uid?"Campeão!":cup.out?(cup.out==="grupos"?"Eliminado na fase de grupos":"Eliminado "+cup.out):g&&cup.ko.length===0?`Grupo ${String.fromCharCode(65+gi)} · ${pos}º lugar`:"Classificado para o mata-mata";
  let h=`<div class="copa-topo"><span class="copa-trofeu" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 6h3a3 3 0 0 1-3 4M7 6H4a3 3 0 0 0 3 4"/></svg></span>
    <div><b class="copa-nome">${esc(cup.nome)} ${G.year}</b><span class="muted peq">${esc(cup.fase)}</span></div></div>
    <div class="copa-status ${cup.champ===uid?"v":cup.out?"d":""}">${esc(status)}</div>`;
  // jogos do clube
  const jogos=[];
  const datas=G.cal.map((e,i)=>[e,i]).filter(([e])=>e.k==="C");
  for(let d=0;d<10;d++){
    let par=null,fase="";
    if(d<6){if(!g)continue;const pr=PAD_GRUPO[d].find(([a,b])=>g[a]===uid||g[b]===uid);par=[g[pr[0]],g[pr[1]]];fase=`Grupos · ${d+1}ª rodada`}
    else{par=(cup.ko[d-6]||[]).find(([a,b])=>a===uid||b===uid);fase=FASES_KO[d-6];if(!par)continue}
    const r=(cup.res[d]||[]).find(x=>x[0]===par[0]&&x[1]===par[1]);
    const di=datas.find(([e])=>e.d===d);
    let quando="";if(di&&!r){const rod=G.cal.slice(0,di[1]).filter(e=>e.k==="L").length;quando=`Quarta, depois da rodada ${rod} do campeonato`}
    jogos.push({par,fase,r,quando});
  }
  h+=`<h2>Seus jogos</h2><div class="cartao" style="padding-block:4px">${jogos.length?jogos.map(({par,fase,r,quando})=>{const [a,b]=par,A=G.clubs[a],B=G.clubs[b];
    let cls="";if(r){const gu=a===uid?r[2]:r[3],go=a===uid?r[3]:r[2];cls=gu>go||(gu===go&&r[4]&&((r[4]==="h")===(a===uid)))?"v":gu<go||(gu===go&&r[4])?"d":"e"}
    return `<div class="jogo-copa ${cls}"><span class="jc-fase">${esc(fase)}</span><div class="jc-linha"><span class="jc-t">${esc(A.name)}</span><span class="jc-p num">${r?`${r[2]} × ${r[3]}${r[4]?" (p)":""}`:"×"}</span><span class="jc-t d">${esc(B.name)}</span></div>${!r&&quando?`<span class="jc-q">${esc(quando)} · ${esc(a===uid?estadioDe(A):estadioDe(A))}</span>`:""}</div>`}).join(""):'<p class="muted">Nenhum jogo.</p>'}</div>`;
  // grupo do clube primeiro
  if(g)h+=`<h2>Seu grupo · Grupo ${String.fromCharCode(65+gi)}</h2><div class="cartao rolar" style="padding:6px 10px">${tabelaHTML(grupoOrdenado(g),cup.gst,j=>j<2?"z-sobe":"")}</div><div class="legenda" style="margin-top:8px"><span><i style="background:var(--ok)"></i>Avançam ao mata-mata</span></div>`;
  if(cup.ko.length)h+=cup.ko.map((pares,f)=>{const res=cup.res[6+f]||[];return `<h2>${FASES_KO[f]}</h2><div class="cartao" style="padding-block:6px">${pares.map(([a,b],i)=>{const r=res[i];return `<div class="res${a===uid||b===uid?" meu":""}"><span>${esc(G.clubs[a].name)}</span><span class="c num">${r?`${r[2]} × ${r[3]}${r[4]?" (p)":""}`:"×"}</span><span>${esc(G.clubs[b].name)}</span></div>`}).join("")}</div>`}).reverse().join("");
  h+=`<h2>Todos os grupos</h2><div class="grupos">${cup.groups.map((gg,i)=>`<div class="cartao rolar" style="padding:6px 10px"><b class="etapa">Grupo ${String.fromCharCode(65+i)}</b>${tabelaHTML(grupoOrdenado(gg),cup.gst,j=>j<2?"z-sobe":"")}</div>`).join("")}</div>`;
  if(cup.champ)h+=`<p class="peq" style="margin-top:12px">Campeão: <b>${esc(G.clubs[cup.champ].name)}</b></p>`;
  return h;
}
function telaCopa(){
  const cup=G.cup,uid=G.user.club;
  let h=`<p class="muted peq" style="margin:10px 0 0">${esc(cup.fase)}${cup.champ?` · Campeão: <b>${esc(G.clubs[cup.champ].name)}</b>`:""}</p>`;
  if(cup.ko.length){
    h+=cup.ko.map((pares,f)=>{const res=cup.res[6+f]||[];return `<h2>${FASES_KO[f]}</h2><div class="cartao" style="padding-block:6px">${pares.map(([a,b],i)=>{const r=res[i];return `<div class="res${a===uid||b===uid?" meu":""}"><span>${esc(G.clubs[a].name)}</span><span class="c num">${r?`${r[2]} × ${r[3]}${r[4]?" (p)":""}`:"×"}</span><span>${esc(G.clubs[b].name)}</span></div>`}).join("")}</div>`}).reverse().join("");
  }
  h+=`<h2>Grupos</h2><div class="grupos">${cup.groups.map((g,i)=>`<div class="cartao rolar" style="padding:6px 10px"><b class="etapa">Grupo ${String.fromCharCode(65+i)}</b>${tabelaHTML(grupoOrdenado(g),cup.gst,j=>j<2?"z-sobe":"")}</div>`).join("")}</div>`;
  return h;
}

const ICO_GRANA=n=>`<svg class="ico-grana" viewBox="0 0 64 48" aria-hidden="true">${[...Array(Math.min(n,4))].map((_,i)=>`<g transform="translate(${4+i*4} ${18-i*5})"><rect width="44" height="24" rx="4" fill="#2e9b57" stroke="#bff0cf" stroke-width="1.6"/><circle cx="22" cy="12" r="6" fill="none" stroke="#bff0cf" stroke-width="1.6"/><text x="22" y="15.5" text-anchor="middle" font-size="9" font-weight="800" fill="#e6ffef">$</text></g>`).join("")}<g transform="translate(40 30)"><circle r="9" cx="9" cy="9" fill="#ffcc33" stroke="#a87400" stroke-width="1.6"/><text x="9" y="12.5" text-anchor="middle" font-size="10" font-weight="900" fill="#7a5200">$</text></g></svg>`;
const icoCupons=n=>`<span class="ico-cupons" style="--n:${Math.min(n,4)}">${[...Array(Math.min(n,4))].map(()=>ICO_CUPOM).join("")}</span>`;
function telaCambio(){const cp=cupons();

function telaMercado(){
